<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bili-ai 智能控制台</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#16191f; --panel2:#1b1f27; --line:#262b35;
    --txt:#e6e9ef; --dim:#8b93a1; --blue:#3b82f6; --green:#22c55e;
    --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;
       font:14px/1.6 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#11141a;
         border-bottom:1px solid var(--line);flex:none}
  .logo{font-weight:700;font-size:15.5px;letter-spacing:.3px}
  .logo b{color:var(--blue)}
  .pill{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;
        padding:3px 10px;background:var(--panel);white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;max-width:38vw}
  .spacer{flex:1}
  button{cursor:pointer;font-family:inherit;font-size:13px;border:1px solid var(--line);
         background:var(--panel2);color:var(--txt);padding:7px 14px;border-radius:8px;transition:.15s}
  button:hover{border-color:#3a4252;background:#222836}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.primary:hover{background:#2f74e8}
  button.ghost{background:transparent}
  main{flex:1;overflow:auto;padding:22px 0 10px}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}
  .msg{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start}
  .msg .av{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;
           justify-content:center;font-size:12px;font-weight:700;background:#243043;color:#9dc0f5}
  .msg.user{flex-direction:row-reverse}
  .msg.user .av{background:#1f3a2a;color:#8ff0b5}
  .bubble{max-width:78%;background:var(--panel);border:1px solid var(--line);
          border-radius:12px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{background:#16233a;border-color:#22395c}
  .steps{margin:6px 0 0;border-left:2px solid #2a3444;padding-left:10px}
  .step{font-size:12.5px;color:#b9c2cf;padding:3px 0}
  .step .nm{color:#9dc0f5;font-weight:600}
  .step .ok{color:var(--green)} .step .no{color:var(--red)}
  .step pre{margin:4px 0 0;background:#0a0c10;border:1px solid var(--line);border-radius:8px;
            padding:8px;max-height:180px;overflow:auto;font:12px/1.5 Consolas,monospace;
            color:#aab4c2;white-space:pre-wrap;word-break:break-all}
  .confirm{border:1px solid #5a4a22;background:#241f14;border-radius:12px;padding:12px 14px;margin:8px 0 0}
  .confirm .t{color:#f5c66b;font-size:13px;margin-bottom:8px}
  .confirm .pv{font-size:13.5px;margin-bottom:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--dim);border:1px dashed #333c4c;border-radius:20px;padding:3px 10px}
  .hint{color:var(--dim);font-size:12.5px}
  footer{flex:none;border-top:1px solid var(--line);background:#11141a;padding:12px 18px 16px}
  .inbar{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;background:#0f1318;border:1px solid var(--line);color:var(--txt);
           border-radius:10px;padding:10px 12px;font:inherit;resize:none;min-height:44px;
           max-height:150px;outline:none;line-height:1.5}
  textarea:focus{border-color:#34507a}
  .tip{max-width:860px;margin:8px auto 0;color:var(--dim);font-size:12px;display:flex;gap:12px}
  .tip span{cursor:pointer;border-bottom:1px dashed #333c4c}
  .tip span:hover{color:#c9d4e4}
  /* 未就绪遮罩 */
  .gate{position:fixed;inset:0;background:#0b0d10f2;display:none;align-items:center;
        justify-content:center;z-index:50;padding:20px}
  .gate.show{display:flex}
  .gate .box{max-width:520px;background:var(--panel);border:1px solid var(--line);
             border-radius:14px;padding:22px 24px}
  .gate h2{margin:0 0 10px;font-size:17px}
  .gate p{margin:0 0 14px;color:var(--dim);font-size:13.5px;line-height:1.7}
  /* 设置抽屉 */
  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--panel);
          border-left:1px solid var(--line);transform:translateX(102%);transition:.22s;
          z-index:60;padding:18px;overflow:auto}
  .drawer.open{transform:none}
  .drawer h3{margin:0 0 14px;font-size:15px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
  .field input{width:100%;background:#0f1318;border:1px solid var(--line);color:var(--txt);
               border-radius:8px;padding:8px 10px;font:inherit;outline:none}
  .field input:focus{border-color:#34507a}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mask{position:fixed;inset:0;background:#0008;display:none;z-index:55}
  .mask.show{display:block}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
         background:#222a36;border:1px solid #33405a;color:#e8eefb;padding:9px 16px;
         border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:80vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:#5c2b2b;background:#341d1d;color:#ffc9c9}
</style>
</head>
<body>
<header>
  <div class="logo">bili<b>-ai</b> 智能控制台</div>
  <span class="pill" id="pModel">模型：—</span>
  <span class="pill" id="pScene">—</span>
  <span class="spacer"></span>
  <button class="ghost" onclick="clearChat()">清空</button>
  <button onclick="openDrawer()">模型设置</button>
</header>

<main id="main"><div class="wrap" id="feed"></div></main>

<footer>
  <div class="inbar">
    <textarea id="input" rows="1" placeholder="直接说要做的事，比如「搜一下嵌入式开发，挑个播放量高的看看评论」"></textarea>
    <button class="primary" id="send" onclick="send()">发送</button>
  </div>
  <div class="tip" id="tips">
    <span onclick="fill('现在在干嘛，当前是什么视频')">看当前状态</span>
    <span onclick="fill('搜一下机械键盘，挑第一个打开')">搜索并打开</span>
    <span onclick="fill('看看这个视频评论区在聊什么')">读评论</span>
    <span onclick="fill('帮我在这条视频下写一条评论，就说讲得挺实在')">发评论</span>
  </div>
</footer>

<div class="gate" id="gate"><div class="box">
  <h2>智能控制台未启用</h2>
  <p id="gateWhy">—</p>
  <div class="chips">
    <button class="primary" onclick="closeGate();openDrawer()">配置强模型</button>
    <button class="ghost" onclick="location.href='/chat'">先用旧版打字控制</button>
  </div>
  <p class="hint" style="margin-top:14px">弱模式下本地 0.5B 撑不起多步操作与工具调用，所以这个入口只在强模式 + 配好强模型时开放。</p>
</div></div>

<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <h3>强模型设置</h3>
  <div class="field"><label>接口地址（OpenAI 兼容）</label>
    <input id="fBase" placeholder="https://api.deepseek.com/v1"></div>
  <div class="field"><label>模型名</label>
    <input id="fModel" placeholder="deepseek-chat"></div>
  <div class="field"><label>API Key<span class="hint" id="keyHint"></span></label>
    <input id="fKey" type="password" placeholder="留空表示不修改"></div>
  <div class="row2">
    <div class="field"><label>温度</label><input id="fTemp" type="number" step="0.1" min="0" max="2"></div>
    <div class="field"><label>单轮最多步数</label><input id="fSteps" type="number" min="1" max="12"></div>
  </div>
  <div class="chips" style="margin-top:6px">
    <button class="primary" onclick="saveCfg()">保存</button>
    <button class="ghost" onclick="closeDrawer()">取消</button>
  </div>
  <p class="hint" style="margin-top:14px">Key 只存在本机 app/.data/agent.json，接口只回掩码。<br>
  工具：搜索、打开视频、读评论 / 字幕、看消息、发评论、回复、弹幕、点赞、投币、收藏、巡览开关。</p>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let MSGS = [], READY = false, BUSY = false, CFG = {};

function toast(m, err){ const t=$('toast'); t.textContent=m; t.className='show'+(err?' err':'');
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',3200); }
async function api(url, body){
  const opt = body===undefined ? {} : {method:'POST',headers:{'Content-Type':'application/json'},
                                       body:JSON.stringify(body)};
  const r = await fetch(url, opt);
  try { return await r.json(); } catch(e){ return {ok:false, say:'返回不是 JSON'}; }
}
function fill(t){ $('input').value=t; $('input').focus(); }

// ---------- 状态 ----------
async function loadCfg(){
  const j = await api('/api/agent');
  if(!j || !j.ok) return;
  READY = !!j.ready; CFG = j.cfg || {};
  $('pModel').textContent = '模型：' + (CFG.model || '未配置');
  $('keyHint').textContent = CFG.has_key ? '（已设置 ' + CFG.key_masked + '，留空不改）' : '（还没设置）';
  $('fBase').value = CFG.base_url || '';
  $('fModel').value = CFG.model || '';
  $('fTemp').value = CFG.temperature ?? 0.3;
  $('fSteps').value = CFG.max_steps ?? 8;
  $('send').disabled = !READY;
  $('input').disabled = !READY;
  if(!READY && !$('gate').classList.contains('show') && !MSGS.length){
    $('gateWhy').textContent = j.reason || '还没配置强模型。';
    $('gate').classList.add('show');
  }
  if(READY) $('gate').classList.remove('show');
}
async function loadScene(){
  const j = await api('/api/state');
  if(!j) return;
  const c = j.current || {}, pl = j.player || {}, a = j.account || {};
  const bv = c.bvid || pl.bvid, ti = c.title || pl.title;
  $('pScene').textContent = bv ? ('当前：' + (ti || bv).slice(0, 28)) :
    (a.login ? '未打开视频' : '未登录');
}
function openDrawer(){ $('drawer').classList.add('open'); $('mask').classList.add('show'); }
function closeDrawer(){ $('drawer').classList.remove('open'); $('mask').classList.remove('show'); }
function closeGate(){ $('gate').classList.remove('show'); }

async function saveCfg(){
  const patch = {base_url:$('fBase').value.trim(), model:$('fModel').value.trim(),
                 temperature:$('fTemp').value, max_steps:$('fSteps').value};
  const k = $('fKey').value.trim();
  if(k) patch.api_key = k;
  const j = await api('/api/agent', patch);
  if(!j.ok){ toast('保存失败', true); return; }
  $('fKey').value = '';
  toast('已保存');
  closeDrawer();
  await loadCfg();
  if(READY) toast('强模型已就绪，可以下指令了');
}

// ---------- 渲染 ----------
function esc(s){ return (s+'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function addMsg(role, html, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'ai') + (cls ? ' ' + cls : '');
  d.innerHTML = `<div class="av">${role === 'user' ? '我' : 'AI'}</div>
                 <div class="bubble">${html}</div>`;
  $('feed').appendChild(d);
  $('main').scrollTop = $('main').scrollHeight;
  return d;
}
function stepsHtml(steps){
  if(!steps || !steps.length) return '';
  return '<div class="steps">' + steps.map(s => {
    const arg = Object.entries(s.args || {}).map(([k,v]) => `${k}=${v}`).join(' ');
    return `<div class="step"><span class="${s.ok?'ok':'no'}">${s.ok?'✓':'✕'}</span>
      <span class="nm">${esc(s.name)}</span> ${esc(arg)}
      ${s.text ? `<pre>${esc(s.text)}</pre>` : ''}</div>`;
  }).join('') + '</div>';
}
function thinking(){
  const d = addMsg('assistant', '<span class="hint">思考中…</span>', 'tmp');
  return d;
}

// ---------- 发送 ----------
async function send(){
  const box = $('input');
  const text = box.value.trim();
  if(!text || BUSY) return;
  if(!READY){ openDrawer(); return; }
  box.value = ''; box.style.height='auto';
  MSGS.push({role:'user', content:text});
  addMsg('user', esc(text));
  BUSY = true; $('send').disabled = true;
  const t = thinking();
  try {
    const j = await api('/api/agent/run', {messages: MSGS});
    t.remove();
    if(!j.ok){
      addMsg('assistant', esc(j.say || '出错了'));
    } else if(j.kind === 'confirm'){
      const html = esc(j.say || '') + stepsHtml(j.steps) +
        `<div class="confirm"><div class="t">需要你确认（对外发布不可撤销）</div>
         <div class="pv">${esc(j.preview || '')}</div>
         <div class="chips"><button class="primary" id="ok_${j.token}">确认执行</button>
         <button class="ghost" id="no_${j.token}">取消</button></div></div>`;
      addMsg('assistant', html);
      const yes = document.getElementById('ok_' + j.token);
      yes.onclick = () => execToken(j.token, yes);
      document.getElementById('no_' + j.token).onclick = (e) => {
        e.target.closest('.confirm').innerHTML = '<div class="hint">已取消，没有发出去。</div>';
      };
    } else {
      addMsg('assistant', esc(j.say || '完成') + stepsHtml(j.steps));
      MSGS.push({role:'assistant', content: j.say || ''});
    }
  } catch(e){
    t.remove(); addMsg('assistant', '请求失败：' + esc(e.message || e));
  } finally {
    BUSY = false; $('send').disabled = !READY;
    box.focus();
  }
}
async function execToken(token, btn){
  btn.disabled = true; btn.textContent = '执行中…';
  const j = await api('/api/agent/exec', {token});
  btn.closest('.confirm').innerHTML = `<div class="${j.ok?'':'hint'}">${esc(j.say || (j.ok?'完成':'失败'))}</div>`;
  if(j.items) btn.closest('.confirm').insertAdjacentHTML('beforeend',
    stepsHtml(j.items.map(i => ({name:i.name, args:{preview:i.preview || ''}, ok:i.ok, text:i.text}))));
  if(j.ok) MSGS.push({role:'assistant', content: j.say || '已执行'});
}
function clearChat(){ MSGS = []; $('feed').innerHTML = ''; }

$('input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(150, e.target.scrollHeight) + 'px';
});

loadCfg(); loadScene();
setInterval(loadScene, 8000);
</script>
</body>
</html>
