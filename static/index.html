<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bili-ai · 后台</title>
<style>
  :root{
    /* 明色中性层级：页面底 / 卡片 / 次级面 / 控件面 */
    --bg:#f5f6f7;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --surface-3:#f2f3f5;
    --line:#e3e5e8;
    --line-strong:#d5d8dd;
    --text:#18191c;
    --text-2:#3d4149;
    --dim:#61666d;
    --muted:#9499a0;
    --blue:#00aeec;
    --blue-dark:#0095cc;
    --blue-soft:#e6f6fd;
    --pink:#fb7299;
    --ok:#12845c;
    --warn:#b26a00;
    --err:#d9363e;
    --r-sm:4px; --r-md:6px; --r-lg:8px;
    --ease:ease;
    --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 var(--font);
       height:100vh;display:flex;flex-direction:column;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible,select:focus-visible,textarea:focus-visible{
       outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  header{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;
       background:var(--surface);border-bottom:1px solid var(--line)}
  .logo{font-size:15px;font-weight:600;letter-spacing:0}
  .logo b{font-weight:600;color:var(--pink)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
       border-radius:var(--r-sm);font-size:11px;font-weight:400;line-height:1;
       background:var(--surface-3);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none}
  .badge.on{color:var(--ok);border-color:#bfe3d5;background:#f1faf6}
  .badge.on::before{background:var(--ok)}
  .badge.pink{color:var(--pink);border-color:#fbd5e0;background:#fef3f6}
  .badge.pink::before{background:var(--pink)}
  .spacer{flex:1}
  .meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 账号 */
  .acct{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;border:1px solid var(--line);
        border-radius:var(--r-md);background:var(--surface);font-size:12px}
  .acct img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--surface-3);
        border:1px solid var(--line)}
  .acct .nm{color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct button{color:var(--dim);font-size:11px;padding:3px 8px;border-radius:var(--r-sm);
        border:1px solid transparent}
  .acct button:hover{color:var(--text);border-color:var(--line);background:var(--surface-3)}
  .btn-login{padding:5px 14px;border-radius:var(--r-md);background:var(--blue);color:#fff;
        font-weight:500;font-size:12.5px}
  .btn-login:hover{background:var(--blue-dark)}

  main{flex:1;display:grid;grid-template-columns:minmax(320px,392px) minmax(0,1fr) 336px;
       gap:12px;padding:12px;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;
       background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
  .panel h2{flex:none;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.02em;
       padding:10px 14px;border-bottom:1px solid var(--line)}

  /* 播放器 */
  .cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden;flex:none}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
       color:var(--muted);font-size:12.5px}
  .cover .badge{position:absolute;left:10px;top:10px;z-index:2;background:rgba(0,0,0,.55);
       border-color:rgba(255,255,255,.22);color:#fff}
  .cover .badge::before{background:#fff}
  .pbody{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .ptitle{font-size:14.5px;font-weight:600;line-height:1.45;max-height:2.9em;overflow:hidden;
       color:var(--text)}
  .pup{font-size:12px;color:var(--dim)}
  .bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .18s linear}
  .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
       font-family:var(--mono);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:7px 9px}
  .stat b{display:block;font-size:13px;font-weight:600;color:var(--text);
       font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim)}

  /* 互动 */
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
  .act{padding:7px 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
       font-size:12px;color:var(--dim);text-align:center;transition:all .15s var(--ease)}
  .act:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2)}
  .act.on{color:var(--blue-dark);border-color:#a9e2f7;background:var(--blue-soft)}
  .act:disabled{opacity:.45;cursor:not-allowed}

  /* 字幕 */
  .subbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);
       font-size:12px;color:var(--dim);flex-wrap:wrap;flex:none}
  .subbar select{background:var(--surface);color:var(--text);border:1px solid var(--line);
       border-radius:var(--r-md);padding:4px 6px;font:inherit;font-size:12px;outline:none;max-width:160px}
  .subbar button{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-md);
       font-size:12px;color:var(--text-2);background:var(--surface)}
  .subbar button:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
  .subbar button:disabled{opacity:.45;cursor:not-allowed}
  .subbar #subMeta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .subt{overflow:auto;flex:1;padding:10px 14px;font-size:13px;line-height:1.65}
  .subt .cue{display:flex;gap:12px;padding:2px 0}
  .subt .cue .ts{color:var(--muted);font-family:var(--mono);font-size:11px;
       font-variant-numeric:tabular-nums;flex:none;min-width:44px;padding-top:3px}
  .subt .cue .tx{word-break:break-word;color:var(--text-2)}
  .subt .hint{font-size:11.5px;color:var(--muted);padding:8px 0}

  /* 列表 / 评论 */
  .tabs{display:flex;gap:0;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
  .tab{position:relative;padding:9px 12px;font-size:12.5px;color:var(--dim);
       border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0}
  .tab:hover{color:var(--text)}
  .tab.cur{color:var(--blue-dark);border-bottom-color:var(--blue);background:none;box-shadow:none}
  .pane{overflow:auto;flex:1;display:none}
  .pane.cur{display:block}
  .row{display:flex;gap:10px;padding:10px 14px;align-items:center;cursor:default;
       border-bottom:1px solid var(--line);transition:background .12s var(--ease)}
  .row:hover{background:var(--surface-2)}
  .row.cur{background:var(--blue-soft);box-shadow:inset 2px 0 0 var(--blue)}
  .idx{width:20px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
  .thumb{width:92px;aspect-ratio:16/9;border-radius:var(--r-sm);background:var(--surface-3);
       object-fit:cover;flex:none;border:1px solid var(--line)}
  .info{min-width:0;flex:1}
  .t{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;
       -webkit-line-clamp:2;overflow:hidden;word-break:break-word;color:var(--text)}
  .sub{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bvid{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--surface-3);
       border:1px solid var(--line);padding:0 4px;border-radius:3px}
  .empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:12.5px}

  .cmt{padding:10px 14px;border-bottom:1px solid var(--line)}
  .cmt:hover{background:var(--surface-2)}
  .cmt .h{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--dim)}
  .cmt .h b{color:var(--text-2);font-weight:600;font-size:12.5px}
  .cmt .h .lk{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .cmt .m{margin-top:4px;font-size:13px;line-height:1.6;word-break:break-word;color:var(--text-2)}
  .cmtbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);
       font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
  .cmtbar button{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-md);
       color:var(--text-2);background:var(--surface)}
  .cmtbar button:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
  .cmtbar button:disabled{opacity:.45;cursor:not-allowed}
  .cmtbox{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex:none}
  .cmtbox textarea{flex:1;resize:vertical;min-height:44px;padding:7px 9px;border-radius:var(--r-md);
       border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;
       font-size:13px;outline:none}
  .cmtbox textarea::placeholder{color:var(--muted)}
  .cmtbox textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  .cmtbox button{padding:8px 16px;border:1px solid var(--line);border-radius:var(--r-md);
       background:var(--surface);font-size:12.5px;color:var(--text-2)}
  .cmtbox button:hover{border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}

  /* 评论面板：来源切换（热门/最新/回复我的/@我的） */
  .cmtsrc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;
       border-bottom:1px solid var(--line);flex:none}
  .cmtsrc button{padding:4px 11px;border:1px solid var(--line);border-radius:var(--r-md);
       background:var(--surface);font-size:12px;color:var(--text-2)}
  .cmtsrc button:hover:not(:disabled){border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}
  .cmtsrc button.cur{color:var(--blue-dark);border-color:#b8e6f7;background:var(--blue-soft)}
  .cmtsrc button:disabled{opacity:.45;cursor:not-allowed}
  .wsw{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer;
       white-space:nowrap}
  .wsw input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue);cursor:pointer}
  .wbtn{padding:4px 11px;border:1px solid var(--line);border-radius:var(--r-md);
       background:var(--surface);font-size:12px;color:var(--text-2);white-space:nowrap}
  .wbtn:hover:not(:disabled){border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}
  .wbtn:disabled{opacity:.45;cursor:not-allowed}
  .wbtn.primary{color:var(--blue-dark);border-color:#b8e6f7;background:var(--blue-soft)}
  .pane.cur#cmts{display:flex;flex-direction:column;overflow:hidden;min-height:0}
  #cmtBody{overflow:auto;flex:1;min-height:0}
  .msg{padding:10px 14px;border-bottom:1px solid var(--line)}
  .msg:hover{background:var(--surface-2)}
  .msg .h{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .msg .h b{color:var(--text-2);font-weight:600;font-size:12.5px}
  .msg .h .lk{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .msg .src{margin-top:3px;font-size:11.5px;color:var(--muted)}
  .msg .m{margin-top:5px;font-size:13px;line-height:1.6;color:var(--text-2);word-break:break-word}
  .msg .my{margin-top:4px;font-size:12px;color:var(--dim);word-break:break-word}
  .msg .rd{margin-top:4px;font-size:12px;color:var(--ok);word-break:break-word}
  .msg .box{display:flex;gap:8px;align-items:flex-end;margin-top:7px}
  .msg .box textarea{flex:1;resize:vertical;min-height:34px;padding:6px 8px;border-radius:var(--r-md);
       border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;
       font-size:12.5px;outline:none}
  .msg .box textarea::placeholder{color:var(--muted)}
  .msg .box textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  .st{font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);
       background:var(--surface-3);color:var(--dim);line-height:1.7;white-space:nowrap}
  .st.new{color:var(--warn);border-color:#f0d9a8;background:#fdf7e8}
  .st.replied{color:var(--ok);border-color:#bfe3d5;background:#f1faf6}

  /* AI 巡览 */
  .roam{flex:none;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .roamhd{display:flex;align-items:center;gap:10px;padding:7px 14px}
  .roamhd .rs{flex:1;min-width:0;font-size:11.5px;color:var(--dim);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roamopts{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:0 14px 9px}
  .roamopts label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
  .roamopts input,.roamopts select{height:24px;padding:0 6px;border:1px solid var(--line);
       border-radius:var(--r-md);background:var(--surface);color:var(--text);font:inherit;
       font-size:12px;outline:none}
  .roamopts input:focus,.roamopts select:focus{border-color:var(--blue)}
  .roamopts input:disabled{opacity:.5}
  .roamopts input[type=number]{width:66px}
  .roamopts label.chk{flex-direction:row;align-items:center;gap:5px;padding-bottom:3px}
  .roamopts label.chk input{height:auto;width:auto}
  .roamopts label.chk.off{opacity:.45}
  .roamopts input#roamKw{width:150px}
  .roamtasks{max-height:230px;overflow:auto;padding:0 14px 10px;display:flex;
       flex-direction:column;gap:7px}
  .rt{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
       padding:8px 10px}
  .rt .h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
       color:var(--dim)}
  .rt .h .bv{color:var(--blue-dark)}
  .rt .h .lk{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .rt .bs{font-family:inherit;font-size:10.5px;padding:1px 6px;border-radius:3px;
       border:1px solid var(--line);background:var(--surface-3);color:var(--dim)}
  .rt .bs.waiting{color:var(--warn);border-color:#f0d9a8;background:#fdf7e8}
  .rt .bs.sent{color:var(--ok);border-color:#bfe3d5;background:#f1faf6}
  .rt .bs.skipped{color:var(--muted);border-color:var(--line);background:var(--surface-3)}
  .rt .bs.failed{color:var(--err);border-color:#f5c2c4;background:#fdf1f1}
  .rt .t{margin-top:4px;font-size:12.5px;line-height:1.5;color:var(--text-2);
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rt .ex{margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--muted);
       max-height:34px;overflow:hidden}
  .rt .box{display:flex;flex-direction:column;gap:6px;margin-top:7px}
  .rt textarea{width:100%;resize:vertical;min-height:36px;padding:6px 8px;
       border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
       color:var(--text);font:inherit;font-size:12.5px;outline:none}
  .rt textarea::placeholder{color:var(--muted)}
  .rt textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  .rt .btns{display:flex;gap:6px;justify-content:flex-end}
  .rt .ex.bad{color:var(--err);max-height:64px}
  .rt .ai{margin-top:7px;border:1px solid #cfe6f7;border-radius:var(--r-md);
       background:#f4fbff;padding:6px 8px}
  .rt .ai .lb{font-size:10.5px;color:var(--blue-dark);letter-spacing:.02em}
  .rt .ai .tx{margin-top:3px;font-size:12.5px;line-height:1.55;color:var(--text-2);
       white-space:pre-wrap;word-break:break-word;max-height:88px;overflow:auto}
  .rt .ai .btns{margin-top:5px}

  /* 日志 */
  .log{overflow:auto;flex:1;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.55}
  .l{display:flex;gap:8px;padding:3px 4px;border-radius:3px}
  .l:hover{background:var(--surface-3)}
  .l .lt{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .l .c{color:var(--blue-dark);flex:none}
  .l.bad .c{color:var(--err)}
  .l .s{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{flex:none;font-size:11px;color:var(--muted);text-align:center;padding:6px;
       border-top:1px solid var(--line)}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
       justify-content:center;z-index:50}
  .mask.cur{display:flex}
  .dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       box-shadow:0 8px 28px rgba(0,0,0,.14);padding:20px;width:336px;
       display:flex;flex-direction:column;gap:12px;align-items:center}
  .dlg h3{font-size:14px;font-weight:600;color:var(--text)}
  .dlg .qbox{width:220px;height:220px;background:#fff;border:1px solid var(--line);
       border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .dlg .qbox img{width:100%;height:100%;object-fit:contain}
  .dlg .tip{font-size:12px;color:var(--dim);text-align:center;min-height:18px}
  .dlg .tip.ok{color:var(--ok)} .dlg .tip.bad{color:var(--err)}
  .dlg .row2{display:flex;gap:8px}
  .dlg .row2 button{padding:6px 14px;border:1px solid var(--line);border-radius:var(--r-md);
       font-size:12.5px;color:var(--text-2);background:var(--surface)}
  .dlg .row2 button:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .folders{width:100%;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .folders button{text-align:left;padding:8px 12px;border:1px solid var(--line);
       border-radius:var(--r-md);font-size:13px;color:var(--text-2);background:var(--surface)}
  .folders button:hover{border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}
  /* 设置弹层（较宽的窄表单） */
  .dlg.wide{width:462px;align-items:stretch}
  .dlg .frm{display:flex;flex-direction:column;gap:9px}
  .dlg .frm label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--dim)}
  .dlg .frm input,.dlg .frm textarea{width:100%;height:28px;padding:0 8px;
       border:1px solid var(--line);border-radius:var(--r-md);font-size:12.5px;
       background:var(--surface);color:var(--text);font-family:inherit}
  .dlg .frm textarea{height:auto;padding:6px 8px;resize:vertical;line-height:1.55}
  .dlg .frm input:focus,.dlg .frm textarea:focus{border-color:var(--blue);outline:none}
  .dlg .frm .two{display:flex;gap:8px}
  .dlg .frm .two label{flex:1;min-width:0}
  .dlg .frm .chk{flex-direction:row;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
  .dlg .frm .chk input{width:auto;height:auto;margin:0}
  .dlg .frm .hint{font-size:11px;color:var(--muted);line-height:1.55}
  .dlg .stat{font-size:11.5px;color:var(--dim);line-height:1.7;
       border-top:1px solid var(--line);padding-top:8px}
  .dlg .stat b{color:var(--text-2);font-weight:600}
  .dlg .row2 button.pri{color:var(--blue-dark);border-color:#b8e6f7;background:var(--blue-soft)}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface);
       border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:var(--r-md);
       font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);opacity:0;pointer-events:none;
       transition:opacity .18s var(--ease);z-index:99;max-width:70vw}
  #toast.cur{opacity:1}
  #toast.bad{border-color:#f5c2c4;color:var(--err)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#bfc4cb;background-clip:content-box;border:2px solid transparent}

  @media (max-width:1460px){
    main{grid-template-columns:minmax(300px,340px) minmax(0,1fr) 300px}

    main{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(320px,auto);min-height:0}

</style>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CN = n => n >= 1e8 ? (n/1e8).toFixed(1)+'亿' : n >= 1e4 ? (n/1e4).toFixed(1)+'万' : String(n||0);
const HMS = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h? h+':' : '') + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };
const IMG = u => u ? '/api/thumb?u=' + encodeURIComponent(u.startsWith('//') ? 'https:'+u : u) : '';
function esc(s){ return String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

let snap = null, basePos = 0, baseAt = 0, playing = false, lastBvid = '';
let tab = 'list', cmtPage = 1;

function tick(){
  if (!snap) return;
  const p = snap.player || {};
  let pos = p.pos || 0;
  if (playing && p.dur) pos = Math.min(p.dur, pos + (performance.now() - baseAt)/1000);
  $('#tcur').textContent = HMS(pos);
  $('#tdur').textContent = HMS(p.dur);
  $('#bar').style.width = p.dur ? Math.min(100, pos/p.dur*100) + '%' : '0%';
}
setInterval(tick, 200);

/* ---------- 请求 ---------- */
async function api(path, body){
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}
let toastT = null;
function toast(msg, bad){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'cur' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = '', 2600);
}
async function cmd(name, args){
  const j = await api('/api/cmd', {name, args: args||{}});
  if (!j.ok) toast(j.out.split('\n')[0], true);
  else toast(j.out.split('\n')[0]);
  return j;
}

/* ---------- 账号 ---------- */
let qrTimer = null, qrKey = null;

function renderAccount(a){
  a = a || {};
  const box = $('#acct');
  if (a.login){
    box.innerHTML = `
      <div class="acct">
        ${a.avatar ? `<img src="${IMG(a.avatar)}" alt="">` : ''}
        <span class="nm">${esc(a.uname)}</span>
        <button id="btnLogout">退出</button>
      </div>`;
    $('#btnLogout').onclick = async () => {
      await api('/api/auth/logout', {});
      toast('已退出登录');
      refreshAuth();
    };
  } else {
    box.innerHTML = '<button class="btn-login" id="btnLogin">扫码登录</button>';
    $('#btnLogin').onclick = openQr;
  }
}

async function refreshAuth(){
  try {
    const info = await api('/api/auth');
    renderAccount(info.is_login ? {login:true, uname:info.uname, mid:info.mid, avatar:info.avatar} : {login:false});
  } catch (e) { /* 网络异常时保留上次渲染 */ }
}

function closeMask(){
  $('#mask').className = 'mask';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  $('#dlgLlm').style.display = 'none';
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
}

async function openQr(){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  $('#dlgLlm').style.display = 'none';
  $('#qrTip').className = 'tip';
  $('#qrTip').textContent = '正在申请二维码…';
  $('#qrImg').removeAttribute('src');
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  const r = await api('/api/auth/qr', {});
  if (!r.ok){ $('#qrTip').textContent = r.msg || '申请失败'; $('#qrTip').className='tip bad'; return; }
  qrKey = r.key;
  $('#qrImg').src = r.png;
  $('#qrTip').textContent = '用手机 B 站客户端扫一扫';
  qrTimer = setInterval(pollQr, 1600);
}

async function pollQr(){
  if (!qrKey) return;
  let r;
  try { r = await api('/api/auth/poll?key=' + encodeURIComponent(qrKey)); }
  catch (e) { return; }
  const tip = $('#qrTip');
  if (r.status === 'scanned'){ tip.textContent = '已扫码，请在手机上确认登录'; tip.className = 'tip'; }
  else if (r.status === 'expired'){
    tip.textContent = '二维码已失效，点「刷新二维码」重试'; tip.className = 'tip bad';
    clearInterval(qrTimer); qrTimer = null;
  } else if (r.status === 'ok'){
    tip.textContent = '登录成功：' + (r.uname || '') ; tip.className = 'tip ok';
    clearInterval(qrTimer); qrTimer = null;
    toast('登录成功：' + (r.uname || ''));
    setTimeout(() => { closeMask(); refreshAuth(); }, 700);
  } else {
    tip.textContent = '等待扫码…';
  }
}

/* ---------- 互动 ---------- */
function renderInter(s){
  const it = s.inter || {};
  const cur = s.current;
  const login = (s.account || {}).login;
  const on = v => v === true ? ' on' : '';
  const like = $('#btnLike'), coin = $('#btnCoin'), fav = $('#btnFav'), cmt = $('#btnCmt');
  like.textContent = it.liked === true ? '已赞' : (it.liked === false ? '点赞' : '点赞');
  like.className = 'act' + on(it.liked);
  coin.textContent = it.coins ? ('已投 ' + it.coins) : '投币';
  coin.className = 'act' + (it.coins ? ' on' : '');
  fav.textContent = it.favoured === true ? '已收藏' : '收藏';
  fav.className = 'act' + on(it.favoured);
  [like, coin, fav].forEach(b => b.disabled = !cur);
  cmt.disabled = !cur;
  cmt.className = 'act' + (tab === 'cmt' ? ' on' : '');
}

$('#btnLike').onclick = async () => {
  const it = (snap && snap.inter) || {};
  await cmd('like', {on: !(it.liked === true)});
};
$('#btnCoin').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.coins > 0) return toast('该视频已投过币');
  await cmd('coin', {n: 2, also_like: false});
};
$('#btnFav').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.favoured === true) return cmd('unfav', {});
  const r = await fetch('/api/folders').then(x => x.json());
  if (!r.ok){
    toast(r.msg || '读取收藏夹失败', true);
    if (r.need_login) openQr();
    return;
  }
  if (!r.items.length) return toast('账号下没有收藏夹', true);
  showFolders(r.items);
};
$('#btnCmt').onclick = () => { switchTab('cmt'); loadComments(1); };

function showFolders(items){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'none';
  $('#dlgLlm').style.display = 'none';
  $('#dlgFav').style.display = 'flex';
  $('#folderList').innerHTML = items.map(f =>
    `<button data-id="${f.id}">${esc(f.title)} <span style="color:var(--dim);font-size:11px">${f.count}</span></button>`
  ).join('');
  $('#folderList').querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      closeMask();
      await cmd('fav', {folder: b.dataset.id});
    };
  });
}

/* ---------- 评论 ---------- */
function switchTab(t){
  tab = t;
  [['list','#tabList','#list'],['cmt','#tabCmt','#cmts'],
   ['sub','#tabSub','#subs']].forEach(([k,tid,pid]) => {
    const te = $(tid), pe = $(pid);
    if (te) te.className = 'tab' + (t === k ? ' cur' : '');
    if (pe) pe.className = 'pane' + (t === k ? ' cur' : '');
  });
  syncCmtChrome();
  renderInter(snap || {});
}
$('#tabList').onclick = () => switchTab('list');
$('#tabCmt').onclick = () => {
  switchTab('cmt');
  if (isMsgSrc()) loadInbox();
  else if (!((snap||{}).comments||[]).length) loadComments(1);
};

async function sendComment(){
  const el = $('#cmtInput');
  const msg = (el.value || '').trim();
  if (!msg) return toast('评论内容不能为空', true);
  const j = await cmd('comment', {message: msg});
  if (!j.ok) return;
  el.value = '';
  await loadComments(1);
}
$('#cmtSend').onclick = sendComment;
$('#cmtInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendComment(); }
});

async function loadComments(page){
  const j = await cmd('comments', {page, limit: 20});
  if (j.ok) cmtPage = page;
}

async function refreshComments(){
  const j = await cmd('comments', {page: cmtPage, limit: 20});
  return j.ok;
}

$('#cmtPrev').onclick = () => { if (cmtPage > 1) loadComments(cmtPage - 1); };
$('#cmtNext').onclick = () => loadComments(cmtPage + 1);

function renderComments(s){
  if (isMsgSrc()) return;                     // 消息来源由 renderInbox 负责
  const list = s.comments || [], meta = s.comments_meta || {};
  const box = $('#cmtBody');
  $('#cmtbox').style.display = (tab === 'cmt' && s.current) ? 'flex' : 'none';
  if (!list.length){
    box.innerHTML = '<div class="empty">尚未加载评论</div>';
    $('#cmtMeta').textContent = '—';
    $('#cmtPrev').disabled = true; $('#cmtNext').disabled = true;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="cmt">
      <div class="h"><b>${esc(c.uname)}</b><span class="lk">赞 ${CN(c.like)}${c.sub ? ' · 回复 '+CN(c.sub) : ''}</span></div>
      <div class="m">${esc(c.msg)}</div>
    </div>`).join('');
  $('#cmtMeta').textContent = `第 ${meta.page||1} 页 · 共 ${CN(meta.total||0)} 条` + (meta.is_end ? ' · 已到末页' : '');
  $('#cmtPrev').disabled = (meta.page||1) <= 1;
  $('#cmtNext').disabled = !!meta.is_end;
}

/* ---------- 字幕 ---------- */
let subLang = '', subOffset = 0, subDone = false, subLoading = false;

function parseSubTracks(out){
  const tracks = [];
  out.split('\n').forEach(ln => {
    const m = ln.match(/lan=(\S+)\s+(.*?)\s+ai=(\d)\s+lock=(\d)/);
    if (m) tracks.push({lan:m[1], doc:m[2], ai:m[3]==='1', lock:m[4]==='1'});
  });
  return tracks;
}

async function loadSubTracks(){
  const j = await cmd('subtitles', {});
  if (!j.ok) return false;
  const tracks = parseSubTracks(j.out);
  const sel = $('#subLang');
  if (!tracks.length){
    sel.innerHTML = '<option>无字幕轨</option>';
    $('#subBody').innerHTML = '<div class="empty">该视频没有平台字幕（画面内嵌硬字幕无法获取）</div>';
    $('#subMeta').textContent = '0 轨';
    subLang = '';
    return false;
  }
  sel.innerHTML = tracks.map(t =>
    `<option value="${esc(t.lan)}">${esc(t.doc||t.lan)}${t.ai?' · AI':''}${t.lock?' · 需解锁':''}</option>`).join('');
  const usable = tracks.find(t => !t.lock && t.lan === 'ai-zh')
    || tracks.find(t => !t.lock && /^zh/i.test(t.lan))
    || tracks.find(t => !t.lock) || tracks[0];
  sel.value = usable.lan; subLang = usable.lan;
  $('#subMeta').textContent = tracks.length + ' 轨';
  return true;
}

async function loadSubs(reset){
  if (subLoading) return;
  subLoading = true;
  const body = $('#subBody');
  try {
    if (reset){ subOffset = 0; subDone = false; body.innerHTML = ''; }
    const j = await cmd('subtitle', {lang: subLang, offset: subOffset, limit: 300});
    if (!j.ok) return;
    const lines = j.out.split('\n');
    const head = lines[0] || '';
    const cues = [];
    lines.slice(1).forEach(ln => {
      const m = ln.match(/^\[(\d+:\d{2})\]\s(.*)$/);
      if (m) cues.push({ts:m[1], tx:m[2]});
    });
    body.insertAdjacentHTML('beforeend', cues.map(c =>
      `<div class="cue"><span class="ts">${c.ts}</span><span class="tx">${esc(c.tx)}</span></div>`).join(''));
    const nx = (j.out.match(/next: subtitle --offset (\d+)/) || [])[1];
    if (nx){ subOffset = parseInt(nx, 10); $('#subMore').disabled = false; }
    else { subDone = true; $('#subMore').disabled = true; }
    const cm = head.match(/cues=(\d+)\s+chars=(\d+)/);
    $('#subMeta').textContent = subLang + (cm ? ` · ${cm[1]} 句 / ${cm[2]} 字` : '')
      + (subDone ? ' · 已到末尾' : ` · 已读至 ${subOffset}`);
    if (!cues.length && reset) body.innerHTML = '<div class="empty">字幕内容为空</div>';
    body.scrollTop = body.scrollHeight;
  } finally { subLoading = false; }
}

async function exportSubs(){
  const j = await cmd('subtitle', {lang: subLang, export:'txt'});
  if (j.ok){
    const m = j.out.match(/path=(.+)/);
    toast('已导出：' + (m ? m[1].trim() : 'ok'));
  }
}

$('#tabSub').onclick = async () => {

    if (ok) await loadSubs(true);
  }
};
$('#subLang').onchange = () => { subLang = $('#subLang').value; loadSubs(true); };
$('#subLoad').onclick = async () => {
  if (!subLang && !await loadSubTracks()) return;
  await loadSubs(true);
};
$('#subMore').onclick = () => loadSubs(false);
$('#subExport').onclick = async () => {

  exportSubs();
};

/* ---------- 评论来源：热门/最新 + 消息（回复我的 / @我的） ---------- */
const HMT = ts => { const d = new Date((ts||0)*1000);
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' '
    + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const BVOF = s => (String(s||'').match(/BV[0-9A-Za-z]{10}/) || [''])[0];

let cmtSrc = 'hot';                 // hot | new | reply | at
let inboxItems = [], inboxBusy = false;
let inboxDrafts = {};               // msg_id -> 草稿文案（后端拟好的）
let llmCfg = null;                  // 大模型配置（只有掩码，无明文 Key）

const isMsgSrc = () => cmtSrc === 'reply' || cmtSrc === 'at';

function syncCmtChrome(){
  const msg = isMsgSrc();
  document.querySelectorAll('.cmtsrc [data-src]').forEach(b => {
    b.className = b.dataset.src === cmtSrc ? 'cur' : '';
  });
  $('#cmtUnWrap').style.display = msg ? 'inline-flex' : 'none';
  $('#cmtbar').style.display = (msg || tab !== 'cmt') ? 'none' : 'flex';
  $('#cmtbox').style.display = (!msg && tab === 'cmt' && !!(snap || {}).current) ? 'flex' : 'none';
}

function setSrc(k){
  cmtSrc = k;
  syncCmtChrome();
  if (isMsgSrc()) loadInbox(); else loadComments(1);
}
document.querySelectorAll('.cmtsrc [data-src]').forEach(b => {
  b.onclick = () => setSrc(b.dataset.src);
});
$('#cmtUnreplied').onchange = () => { if (isMsgSrc()) loadInbox(); };
$('#cmtRefresh').onclick = () => { isMsgSrc() ? loadInbox() : loadComments(cmtPage); };

async function loadInbox(){
  if (inboxBusy) return;
  inboxBusy = true;
  const btn = $('#cmtRefresh');
  btn.disabled = true; btn.textContent = '拉取中…';
  try {
    const kind = cmtSrc === 'at' ? 'at' : cmtSrc === 'reply' ? 'reply' : 'all';
    const un = $('#cmtUnreplied').checked ? 1 : 0;
    const j = await api(`/api/inbox?kind=${kind}&only_unreplied=${un}&limit=50`);
    if (!j.ok){
      toast(j.msg || '拉取消息失败', true);
      if (j.need_login) openQr();
    } else {
      inboxItems = j.items || [];
      inboxDrafts = j.drafts || inboxDrafts || {};
      if (!inboxItems.length && !un) inboxItems = [];
    }
  } finally {
    inboxBusy = false; btn.disabled = false; btn.textContent = '刷新';
  }
  renderInbox();
}

function renderInbox(){
  const box = $('#cmtBody');
  // 正在输入时不要重建 DOM，否则用户打的字会被冲掉
  const ae = document.activeElement;
  if (ae && ae.tagName === 'TEXTAREA' && box.contains(ae)) return;
  if (!inboxItems.length){
    box.innerHTML = '<div class="empty">没有消息 · 这里只显示别人回复我 / @我的评论</div>';
    return;
  }
  // 保留已输入内容（避免其它代码路径重建时丢字）
  const typed = {};
  box.querySelectorAll('[data-in]').forEach(t => {
    const v = (t.value || '').trim();
    if (v) typed[t.dataset.in] = t.value;
  });
  box.innerHTML = inboxItems.map(m => {
    const st = m.status === 'replied' ? 'replied' : 'new';
    const bv = BVOF(m.uri);
    const src = m.type === 1 ? ('视频 ' + bv) : m.type === 12 ? '文章' : '动态';
    const title = (m.title || '').slice(0, 52);
    const mid = String(m.msg_id || '');
    const draft = typed[mid] || inboxDrafts[mid] || '';
    return `
    <div class="msg">
      <div class="h"><b>${esc(m.uname || '匿名')}</b><span>mid ${esc(String(m.mid || 0))}</span>
        <span class="st ${st}">${st === 'replied' ? '已回复' : '未回复'}</span>
        <span class="lk">${m.kind === 'at' ? '@我' : '回复我'} · ${HMT(m.ts)}</span></div>
      <div class="src">${esc(src)}${title ? ' · ' + esc(title) : ''}</div>
      <div class="m">${esc(m.his_msg || '(对方内容为空)')}</div>
      ${m.my_msg ? `<div class="my">我原评论：${esc(m.my_msg)}</div>` : ''}
      ${st === 'replied' && m.replied_text ? `<div class="rd">已回：${esc(m.replied_text)}</div>` : ''}
      <div class="box">
        <textarea rows="1" data-in="${esc(mid)}" placeholder="手动回一句（内容由你写，直接发到评论区）">${esc(draft)}</textarea>
        <button class="wbtn" data-draft="${esc(mid)}" title="用大模型拟一版草稿，填进输入框，不自动发">AI 拟稿</button>
        <button class="wbtn primary" data-send="${esc(mid)}">回复</button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-send]').forEach(b => {
    b.onclick = () => sendReply(b.dataset.send,
      box.querySelector(`[data-in="${b.dataset.send}"]`), b);
  });
  box.querySelectorAll('[data-draft]').forEach(b => {
    b.onclick = () => draftOne(b.dataset.draft, b,
      box.querySelector(`[data-in="${b.dataset.draft}"]`));
  });
}

/* 单条拟稿：只填输入框，发送仍需点「回复」并确认 */
async function draftOne(msgId, btn, ta){
  if (!llmCfg || !llmCfg.configured){
    toast('先点「AI 回复」填写 API Key', true);
    openLlm();
    return;
  }
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '拟稿中…';
  try {
    const j = await api('/api/llm/draft', {msg_id: msgId});
    if (!j.ok){ toast(j.msg || '拟稿失败', true); return; }
    if (ta) ta.value = j.text || '';
    inboxDrafts[msgId] = j.text || '';
    toast('草稿已生成，确认后点「回复」');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function sendReply(msgId, ta, btn){
  const text = (ta.value || '').trim();
  if (!text) return toast('回复内容不能为空', true);
  if (!confirm('确认把这条内容作为评论回复发出？\n\n' + text)) return;
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const j = await api('/api/reply', {msg_id: msgId, message: text});
    if (!j.ok){
      toast(j.msg || '发送失败', true);
      if (j.need_login) openQr();
      return;
    }
    toast('已回复');
    ta.value = '';
    await loadInbox();
  } finally {
    btn.disabled = false; btn.textContent = '回复';
  }
}

/* ---------- AI 巡览 ---------- */
let roamOpen = false, roamSig = '', roamDraft = {}, roamBusy = false;
let roamAiDraft = {};            // 服务端 AI 草稿原文（只读展示用）
let roamAiBusy = false;          // 「AI 拟稿」按钮在请求中
const RSTAT = {waiting:'待评论', sent:'已发布', skipped:'已跳过', failed:'失败', sending:'发布中'};
// 草稿来源：llm=外部模型自动拟稿，agent=对话助手写稿，human=人工/后台保存
const DBY = {llm:'外部模型草稿', agent:'助手草稿', human:'人工草稿'};

function roamCap(r){ return r.max_per_day ? '/' + r.max_per_day : '(不限)'; }

function roamLlmText(r){
  if (!r.llm_ready) return '未配 Key';
  if (!r.llm_draft) return '关';
  return r.llm_publish ? '开·直发' : '开·只拟稿';
}

function roamSummary(r){
  const s = r.stats || {};
  const mins = Math.max(2, Math.round((r.interval || 1800) / 60));
  return `${r.enabled ? '开' : '关'} · 每 ${mins} 分 · 今日 ${s.today_sent||0}${roamCap(r)}`
    + ` · 待评 ${s.waiting||0} · 已发 ${s.sent||0} · 跳过 ${s.skipped||0}`
    + ` · 来源 ${r.source==='search' ? '关键词' : '热门'}`
    + ` · AI拟稿 ${roamLlmText(r)}`
    + (r.loop ? ' · loop on' : '');
}

function renderRoam(r){
  r = r || {};
  $('#roamSum').textContent = roamSummary(r);
  const chk = $('#roamOn');
  if (document.activeElement !== chk) chk.checked = !!r.enabled;
  const setVal = (sel, v) => {
    const el = $(sel);
    if (el && document.activeElement !== el) el.value = v;
  };
  setVal('#roamInt', Math.max(2, Math.round((r.interval || 1800) / 60)));
  setVal('#roamMax', r.max_per_day || 0);
  setVal('#roamSrc', r.source || 'hot');
  setVal('#roamKw', (r.keywords || []).join(','));
  $('#roamKw').disabled = ($('#roamSrc').value || 'hot') !== 'search';

  // AI 拟稿 / 拟完直发：没配 Key 时整组置灰，直发还依赖拟稿开关
  const ready = !!r.llm_ready;
  const rd = $('#roamDraftOn'), rp = $('#roamPubOn');
  if (rd && document.activeElement !== rd) rd.checked = !!r.llm_draft;
  if (rp && document.activeElement !== rp) rp.checked = !!r.llm_publish;
  if (rd){ rd.disabled = !ready; } 
  if (rp){ rp.disabled = !ready || !(rd && rd.checked); }
  [rd, rp].forEach(el => {
    const lab = el && el.closest('label');
    if (lab) lab.classList.toggle('off', !ready || (el === rp && rp.disabled));
  });
  const aiBtn = $('#roamAi');
  if (aiBtn){
    aiBtn.disabled = !ready || roamAiBusy;
    if (!roamAiBusy) aiBtn.textContent = ready ? 'AI 拟稿' : 'AI 拟稿 · 未配 Key';
  }
  if (!roamOpen) return;
  renderRoamTasks(r.tasks || []);
}

function renderRoamTasks(tasks){
  const box = $('#roamTasks');
  const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA'
                 && box.contains(document.activeElement);
  if (typing) return;                        // 正在输入时不重建 DOM，避免丢草稿
  const sig = JSON.stringify(tasks.map(t => [t.task_id, t.status, t.reason,
                                             t.n_cues, t.chars,
                                             t.draft || '', t.draft_err || '']));
  if (sig === roamSig) return;
  roamSig = sig;
  if (!tasks.length){
    box.innerHTML = '<div class="empty">暂无巡览任务 · 点「立即巡览」跑一轮</div>';
    return;
  }
  roamAiDraft = {};
  box.innerHTML = tasks.map(t => {
    const st = t.status || 'waiting';
    const draft = roamDraft[t.task_id] || '';
    const ex = (t.excerpt || '').slice(0, 180);
    const ai = t.draft || '';
    if (ai) roamAiDraft[t.task_id] = ai;
    return `
      <div class="rt">
        <div class="h"><span class="bv">${esc(t.bvid)}</span>
          <span class="bs ${st}">${RSTAT[st] || st}</span>
          <span class="lk">${t.n_cues||0} 句 · ${t.chars||0} 字${t.lan ? ' · '+esc(t.lan) : ''}</span></div>
        <div class="t">${esc(t.title || '')}</div>
        ${ex ? `<div class="ex">${esc(ex)}</div>` : ''}
        ${t.reason ? `<div class="ex">原因：${esc(t.reason)}</div>` : ''}
        ${ai ? `<div class="ai">
          <div class="lb">${DBY[t.draft_by] || '草稿'}${t.draft_model ? ' · ' + esc(t.draft_model) : ''}${t.draft_at ? ' · ' + esc(t.draft_at) : ''}</div>
          <div class="tx">${esc(ai)}</div>
          <div class="btns">
            <button class="wbtn" data-aifill="${esc(t.task_id)}">填入编辑框</button>
            ${st === 'waiting' ? `<button class="wbtn" data-airedo="${esc(t.task_id)}" data-by="${esc(t.draft_by || '')}">重拟</button>
            <button class="wbtn primary" data-aisend="${esc(t.task_id)}">发这条草稿</button>` : ''}
          </div></div>` : ''}
        ${t.draft_err ? `<div class="ex bad">拟稿失败：${esc(t.draft_err)}</div>` : ''}
        ${st === 'waiting' ? `
        <div class="box">
          <textarea rows="2" maxlength="1000" data-draft="${esc(t.task_id)}"
            placeholder="写评论；或先「复制字幕」交给外部 AI，写完贴回这里">${esc(draft || ai)}</textarea>
          <div class="btns">
            <button class="wbtn" data-copy="${esc(t.task_id)}">复制字幕</button>
            <button class="wbtn" data-savedraft="${esc(t.task_id)}">存为草稿</button>
            <button class="wbtn" data-skip="${esc(t.task_id)}">跳过</button>
            <button class="wbtn primary" data-send="${esc(t.task_id)}">写评论并发送</button>
          </div>
        </div>` : ''}
      </div>`;
  }).join('');
  box.querySelectorAll('[data-draft]').forEach(el => {
    el.oninput = () => { roamDraft[el.dataset.draft] = el.value; };
  });
  box.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => copyRoamText(b.dataset.copy, b);
  });
  box.querySelectorAll('[data-savedraft]').forEach(b => {
    b.onclick = () => saveRoamDraft(b.dataset.savedraft, b);
  });
  box.querySelectorAll('[data-skip]').forEach(b => {
    b.onclick = () => skipRoam(b.dataset.skip, b);
  });
  box.querySelectorAll('[data-send]').forEach(b => {
    b.onclick = () => sendRoam(b.dataset.send, b);
  });
  box.querySelectorAll('[data-aifill]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.aifill;
      const txt = roamAiDraft[id] || '';
      if (!txt) return toast('这条没有 AI 草稿', true);
      roamDraft[id] = txt;
      const ta = box.querySelector('[data-draft="' + id + '"]');
      if (ta){ ta.value = txt; ta.focus(); }
      toast('已填入编辑框，改完点「写评论并发送」');
    };
  });
  box.querySelectorAll('[data-aisend]').forEach(b => {
    b.onclick = () => sendRoamDraft(b.dataset.aisend, b);
  });
  box.querySelectorAll('[data-airedo]').forEach(b => {
    b.onclick = () => {
      const by = b.dataset.by || '';
      if ((by === 'agent' || by === 'human') &&
          !confirm('这条草稿是' + (by === 'agent' ? '助手' : '人工') + '写的，重拟会覆盖它，确定？')) return;
      aiDraft(b.dataset.airedo, false, b, true);
    };
  });
}

async function saveRoamDraft(taskId, btn){
  const ta = document.querySelector('[data-draft="' + taskId + '"]');
  const text = ((ta && ta.value) || roamDraft[taskId] || '').trim();
  if (!text) return toast('编辑框是空的，先写点内容', true);
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    const j = await api('/api/roam/draft_set', {task_id: taskId, text, by: 'human'});
    if (!j.ok) return toast((j.msg || '保存失败').split('\n')[0], true);
    delete roamDraft[taskId];
    roamSig = '';
    renderRoam(j.roam || {});
    toast('已存为草稿（不会自动发，确认后可「发这条草稿」）');
  } finally {
    btn.disabled = false; btn.textContent = '存为草稿';
  }
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return; } catch (e) { /* 降级 */ }
  const ta = document.createElement('textarea');
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

async function copyRoamText(taskId, btn){
  btn.disabled = true; btn.textContent = '读取中…';
  try {
    const j = await api('/api/roam/next', {task_id: taskId});
    if (!j.ok) return toast(j.msg || '读取字幕失败', true);
    const t = j.task || {};
    const txt = t.text_head || t.excerpt || '';
    if (!txt) return toast('该任务字幕正文为空', true);
    await copyText(txt);
    toast(`字幕已复制（${txt.length} 字）`);
  } finally {
    btn.disabled = false; btn.textContent = '复制字幕';
  }
}

async function sendRoam(taskId, btn){
  const ta = document.querySelector('[data-draft="' + taskId + '"]');
  const text = ((ta && ta.value) || roamDraft[taskId] || '').trim();
  if (!text) return toast('先写下评论内容', true);
  if (!confirm('确认把这条评论发到 ' + taskId + ' 对应视频？\n\n' + text)) return;
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const j = await api('/api/roam/comment', {task_id: taskId, message: text});
    if (!j.ok) return toast(j.msg || '发送失败', true);
    toast((j.msg || '已发布').split('\n')[0]);
    delete roamDraft[taskId];
    roamSig = '';
    renderRoam(j.roam || {});
  } finally {
    btn.disabled = false; btn.textContent = '写评论并发送';
  }
}

async function skipRoam(taskId, btn){
  btn.disabled = true;
  try {
    const j = await api('/api/roam/skip', {task_id: taskId});
    toast(j.ok ? '已跳过' : (j.msg || '跳过失败'), !j.ok);
    delete roamDraft[taskId];
    roamSig = '';
    renderRoam(j.roam || {});
  } finally {
    btn.disabled = false;
  }
}

async function sendRoamDraft(taskId, btn){
  const txt = roamAiDraft[taskId] || '';
  if (!txt) return toast('这条没有 AI 草稿', true);
  if (!confirm('直接发布 AI 草稿到 ' + taskId + ' 对应视频？\n\n' + txt)) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = '发送中…';
  try {
    const j = await api('/api/roam/send', {task_id: taskId});
    toast(j.ok ? '已发布 AI 草稿' : (j.msg || '发送失败').split('\n')[0], !j.ok);
    if (j.ok){ delete roamDraft[taskId]; roamSig = ''; renderRoam(j.roam || {}); }
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function aiDraft(taskId, publish, btn, force){
  if (roamAiBusy) return;
  roamAiBusy = true;
  const top = $('#roamAi');
  const oldTop = top ? top.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = '拟稿中…'; }
  else if (top){ top.disabled = true; top.textContent = '拟稿中…'; }
  if (publish && !confirm('拟完立刻发布（公开发布，不可撤回），确定？')) {
    roamAiBusy = false;
    if (btn){ btn.disabled = false; btn.textContent = '重拟'; }
    return;
  }
  try {
    const j = await api('/api/roam/draft', {task_id: taskId || '', publish: !!publish, force: !!force});
    const msgs = j.msgs || [];
    if (!j.ok){
      toast((j.skipped || (msgs[0] || '拟稿失败')).split('\n')[0], true);
    } else {
      toast(`已拟稿 ${j.drafted||0} 条` + (j.published ? ` · 已发 ${j.published} 条` : ''));
    }
    roamSig = '';
    if (taskId) delete roamDraft[taskId];
    renderRoam(j.roam || {});
  } finally {
    roamAiBusy = false;
    if (btn){ btn.textContent = '重拟'; btn.disabled = false; }
    if (top){ top.textContent = oldTop; top.disabled = false; }
  }
}

async function saveRoam(body, okMsg){
  const j = await api('/api/roam/set', body);
  if (!j.ok) toast((j.out || j.msg || '设置失败').split('\n')[0], true);
  else if (okMsg) toast(okMsg);
  if (j.roam){ roamSig = ''; renderRoam(j.roam); }
  return j;
}

$('#roamOn').onchange = () => {
  const on = $('#roamOn').checked;
  saveRoam({enabled: on}, on ? '巡览已开启' : '巡览已关闭');
};
$('#roamInt').onchange = () => {
  const m = Math.max(2, parseFloat($('#roamInt').value) || 30);
  $('#roamInt').value = m;
  saveRoam({interval_min: m}, '频率已设为每 ' + m + ' 分钟');
};
$('#roamMax').onchange = () => {
  const n = Math.max(0, parseInt($('#roamMax').value, 10) || 0);
  $('#roamMax').value = n;
  saveRoam({max_per_day: n}, n ? '每日上限 ' + n + ' 条' : '每日不限');
};
$('#roamSrc').onchange = () => {
  const src = $('#roamSrc').value;
  $('#roamKw').disabled = src !== 'search';
  saveRoam({source: src}, src === 'search' ? '来源：关键词' : '来源：热门');
};
$('#roamKw').onchange = () => {
  saveRoam({keyword: $('#roamKw').value}, '关键词已保存');
};
$('#roamDraftOn').onchange = () => {
  const on = $('#roamDraftOn').checked;
  // 关掉拟稿时顺带关掉直发，避免留下「直发开、拟稿关」的矛盾状态
  const body = on ? {llm_draft: true} : {llm_draft: false, llm_publish: false};
  saveRoam(body, on ? 'AI 拟稿已开启（草稿进任务卡，人工确认后发）' : 'AI 拟稿已关闭');
};
$('#roamPubOn').onchange = () => {
  const on = $('#roamPubOn').checked;
  if (!on){ saveRoam({llm_publish: false}, '拟完直发已关闭'); return; }
  if (!confirm('拟完直发：AI 写完立刻公开发布到 B 站，不可撤回。\n确定开启？')){
    $('#roamPubOn').checked = false;
    return;
  }
  saveRoam({llm_publish: true, llm_draft: true}, 'AI 拟稿并直发已开启');
};
$('#roamAi').onclick = () => {
  if (roamAiBusy) return;
  if (!$('#roamDraftOn').checked){
    toast('先勾上「AI 拟稿」', true);
    return;
  }
  aiDraft('', $('#roamPubOn').checked, null);
};
$('#roamCheck').onclick = async () => {
  if (roamBusy) return;
  roamBusy = true;
  const b = $('#roamCheck');
  b.disabled = true; b.textContent = '巡览中…';
  try {
    const j = await api('/api/roam/check', {});
    const r = j.result || {};
    if (!j.ok) toast('巡览出错：' + (r.err || '未知'), true);
    else {
      const d = r.draft || {};
      const tail = d.drafted || d.published || d.failed
        ? ` · 拟稿 ${d.drafted||0}${d.published ? ' 直发 ' + d.published : ''}${d.failed ? ' 失败 ' + d.failed : ''}`
        : '';
      toast(`tried=${r.tried||0} 取到=${r.picked||0} 跳过=${r.skipped||0}${tail}`);
    }
    roamSig = '';
    renderRoam(j.roam || {});
    if (!roamOpen){ roamOpen = true; syncRoamFold(); }
  } finally {
    roamBusy = false;
    b.disabled = false; b.textContent = '立即巡览';
  }
};
$('#roamFold').onclick = () => { roamOpen = !roamOpen; syncRoamFold(); };

function syncRoamFold(){
  $('#roamOpts').style.display = roamOpen ? 'flex' : 'none';
  $('#roamTasks').style.display = roamOpen ? 'flex' : 'none';
  $('#roamFold').textContent = roamOpen ? '收起' : '展开';
  if (roamOpen && snap) renderRoam(snap.roam || {});
}

/* ---------- 主渲染 ---------- */
function render(s){
  const p = s.player || {}, c = s.current;

  $('#view').textContent = 'view: ' + (s.view || 'idle');
  $('#view').className = 'badge' + (s.view === 'video' ? ' pink' : s.view === 'search' ? ' on' : '');
  $('#mode').textContent = s.readonly ? 'MCP 模式' : 'serve 模式';
  $('#meta').textContent = 'uptime ' + Math.floor(s.uptime||0) + 's · total ' + CN(s.total||0);

  if (c && c.bvid !== lastBvid){
    lastBvid = c.bvid; subLang = ''; subOffset = 0; subDone = false;
    $('#subLang').innerHTML = ''; $('#subMore').disabled = true;
    $('#subMeta').textContent = '—';
    $('#subBody').innerHTML = '<div class="empty">点「读取」拉取当前视频字幕</div>';
  }
  if (c){
    $('#ptitle').textContent = c.title || '—';
    $('#pup').textContent = (c.up||'') + (c.mid ? ' · mid '+c.mid : '') + (c.dur ? ' · '+HMS(c.dur) : '');
    if (c.pic){ $('#cover').src = IMG(c.pic); $('#cover').style.display='block'; $('#coverPh').style.display='none'; }
    $('#stats').innerHTML = [
      ['播放', CN(c.view)], ['点赞', CN(c.like)], ['投币', CN(c.coin)],
      ['收藏', CN(c.fav)], ['弹幕', CN(c.danmaku)], ['评论', CN(c.reply)]
    ].map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  } else {
    $('#ptitle').textContent = '尚未打开视频';
    $('#pup').textContent = '—'; $('#stats').innerHTML = '';
    $('#cover').style.display='none'; $('#coverPh').style.display='flex'; $('#coverPh').textContent='逻辑播放 · 无解码器';
  }
  $('#pstate').textContent = p.bvid ? (p.playing ? 'playing' : 'paused') : 'idle';
  $('#pstate').className = 'badge' + (p.playing ? ' on' : '');

  const items = s.items || [];
  $('#tabList').textContent = s.view === 'search' ? `搜索结果 (${items.length})` : s.view === 'video' ? '详情' : '搜索结果';
  if (items.length){
    $('#list').innerHTML = items.map((it,i) => `
      <div class="row ${p.bvid === it.bvid ? 'cur' : ''}">
        <div class="idx">${i+1}</div>
        ${it.pic ? `<img class="thumb" src="${IMG(it.pic)}" loading="lazy" alt="">` : '<div class="thumb"></div>'}
        <div class="info">
          <div class="t">${esc(it.title)}</div>
          <div class="sub"><span class="bvid">${it.bvid}</span><span>${it.dur}</span><span>${CN(it.play)} 播放</span><span>${esc(it.up)}</span></div>
        </div>
      </div>`).join('');
  } else if (s.view === 'idle'){
    $('#list').innerHTML = '<div class="empty">等待 search 命令</div>';
  } else {
    $('#list').innerHTML = '<div class="empty">无数据（可能命中风控）</div>';
  }

  renderComments(s);
  renderInter(s);
  renderRoam(s.roam || {});
  renderLlm(s.llm || {});
  if (isMsgSrc() && tab === 'cmt' && inboxItems.length) renderInbox();

  const log = s.log || [];
  $('#log').innerHTML = log.length ? log.map(l =>
    `<div class="l ${l.ok?'':'bad'}" title="${esc(l.cmd)} · ${esc(l.summary)}"><span class="lt">${l.t}</span><span class="c">${esc(l.cmd)}</span><span class="s">${esc(l.summary)}</span></div>`
  ).join('') : '<div class="empty">—</div>';
}

/* ---------- AI 自动回复设置（API Key） ---------- */
const LLM_DEF_PROMPT = '用中文回一条 30~60 字的评论回复：先回应对方说的点，语气自然友好，'
  + '不夸张、不官方腔、不加话题标签，不要出现「作为 AI」。';

function llmSetVal(sel, v){
  const el = $(sel);
  if (el && document.activeElement !== el) el.value = v;
}

function renderLlm(l){
  if (!l || !Object.keys(l).length) return;
  llmCfg = l;
  const open = $('#dlgLlm').style.display === 'flex';
  if (open){
    llmSetVal('#llmBase', l.base_url || '');
    llmSetVal('#llmModel', l.model || '');
    llmSetVal('#llmTemp', l.temperature != null ? l.temperature : 0.8);
    llmSetVal('#llmInt', Math.max(1, Math.round((l.interval || 600) / 60)));
    llmSetVal('#llmMax', l.max_per_day != null ? l.max_per_day : 20);
    llmSetVal('#llmPrompt', l.prompt || LLM_DEF_PROMPT);
    const do_ = $('#llmDraftOnly');
    if (document.activeElement !== do_) do_.checked = l.configured ? !l.auto_publish : false;
  }
  const st = l.stats || {};
  const cap = l.max_per_day || 0;
  $('#llmStat').innerHTML = (l.configured
    ? `接口 <b>${esc(l.model || '—')}</b> · Key <b>${esc(l.key_masked || '—')}</b><br>`
      + `今日拟稿 <b>${st.drafted_today || 0}</b> · 今日已自动发 <b>${st.sent_today || 0}</b>`
      + (cap ? ` / ${cap}` : '（不限）')
    : '还没填 Key，AI 拟稿与自动回复都不可用')
    + (st.last_error ? `<br>最近错误：${esc(String(st.last_error).slice(0, 160))}` : '')
    + (st.last_ok ? `<br>最近成功：${esc(String(st.last_ok).slice(0, 60))}` : '');
  // 顶部大字状态：让「开没开」一眼可见
  const box = $('#llmNow');
  if (box){
    const mins = Math.max(1, Math.round((l.interval || 300) / 60));
    if (!l.configured){
      box.style.background = '#fff8e6'; box.style.borderColor = '#ffe0a3';
      box.innerHTML = '<b>未配置</b> · 粘贴 API Key → 点「保存并开启」，之后自动回复「回复我的 / @我的」';
    } else if (l.auto_publish){
      box.style.background = '#eefcf1'; box.style.borderColor = '#b7ecc4';
      box.innerHTML = `<b>自动回复运行中</b> · 每 ${mins} 分钟检查一次 · 未回复的直接发出`
        + ` · 今日已发 <b>${st.sent_today || 0}</b>${cap ? '/' + cap : ''}`;
    } else if (l.auto_draft){
      box.style.background = '#f2f8ff'; box.style.borderColor = '#cfe6ff';
      box.innerHTML = `<b>只拟稿模式</b> · 每 ${mins} 分钟生成草稿，不自动发送`;
    } else {
      box.style.background = '#fff8e6'; box.style.borderColor = '#ffe0a3';
      box.innerHTML = '<b>Key 已存但未开启</b> · 取消勾选「只拟稿不发送」后保存即自动回复';
    }
  }
  const btn = $('#cmtAi');
  btn.textContent = l.auto_publish ? 'AI 回复 · 运行中' : (l.configured ? 'AI 回复 · 已配' : 'AI 回复');
  btn.className = 'wbtn' + (l.configured ? ' primary' : '');
  const top = $('#cmtAiTop');
  if (top) top.textContent = l.auto_publish ? 'AI 自动回复 · 运行中' : 'AI 自动回复';
}

async function openLlm(){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'none';
  $('#dlgFav').style.display = 'none';
  $('#dlgLlm').style.display = 'flex';
  if (qrTimer){ clearInterval(qrTimer); qrTimer = null; }
  const j = await api('/api/llm');
  if (j.ok && j.llm) renderLlm(j.llm);
  else toast(j.msg || '读取配置失败', true);
  const el = $('#llmKey');
  if (el) el.value = '';
}

async function saveLlm(extra, okMsg){
  const body = Object.assign({
    base_url: ($('#llmBase').value || '').trim(),
    model: ($('#llmModel').value || '').trim(),
    temperature: parseFloat($('#llmTemp').value),
    interval: Math.max(1, parseInt($('#llmInt').value, 10) || 10) * 60,
    max_per_day: Math.max(0, parseInt($('#llmMax').value, 10) || 0),
    prompt: ($('#llmPrompt').value || '').trim(),
    auto_draft: true,
    auto_publish: !$('#llmDraftOnly').checked,
  }, extra || {});
  const key = ($('#llmKey').value || '').trim();
  if (key) body.api_key = key;
  const j = await api('/api/llm', body);
  if (j.llm) renderLlm(j.llm);
  if (!j.ok){
    toast(String(j.msg || '保存失败').split('\n')[0], true);
    return j;
  }
  if (key) $('#llmKey').value = '';
  if (okMsg) toast(okMsg);
  return j;
}

$('#cmtAi').onclick = openLlm;
$('#cmtAiTop').onclick = openLlm;
$('#llmClose').onclick = closeMask;
$('#llmSave').onclick = async () => {
  const hasKey = !!($('#llmKey').value || '').trim();
  const b = $('#llmSave');
  b.disabled = true; b.textContent = '保存中…';
  try {
    const s = await saveLlm(null, '');
    if (!s.ok){ toast(String(s.msg || '保存失败').split('\n')[0], true); return; }
    const on = s.llm && s.llm.auto_publish;
    if (!on){ toast(!$('#llmDraftOnly').checked ? '已保存' : '已保存（只拟稿，不自动发送）'); return; }
    // 已开启自动回复：立刻跑一轮，不用等下一个轮询点
    b.textContent = '立即检查中…';
    const r = await api('/api/llm/run', {limit: 5});
    if (r.llm) renderLlm(r.llm);
    if (r.ok){
      toast(`自动回复已开启 · 本轮拟稿 ${r.drafted || 0} 条 / 已发出 ${r.sent || 0} 条`
        + (hasKey ? '' : '（等下一个轮询点继续）'));
    } else {
      const em = String(r.err || r.msg || '自动回复启动失败');
      toast(em.includes('还没跑完') ? '自动回复已开启 · 后台正在处理上一轮' : em.split('\n')[0], !em.includes('还没跑完'));
    }
  } finally {
    b.disabled = false; b.textContent = '保存并开启';
  }
};
$('#llmTest').onclick = async () => {
  const b = $('#llmTest');
  b.disabled = true; b.textContent = '测试中…';
  try {
    const s = await saveLlm(null, '');
    if (!s.ok) return;
    const j = await api('/api/llm/test', {});
    if (j.llm) renderLlm(j.llm);
    if (j.ok) toast(`连接正常 · ${j.model || '模型可用'}（${j.ms || 0}ms）`);
    else toast(String(j.msg || '连接失败').split('\n')[0], true);
  } finally {
    b.disabled = false; b.textContent = '测试连接';
  }
};
$('#llmClear').onclick = async () => {
  if (!confirm('清除后 Key 从本机删除，AI 拟稿与自动回复立即停用。确定清除？')) return;
  await saveLlm({clear_key: true, auto_draft: false, auto_publish: false}, 'Key 已清除');
};

$('#qrRefresh').onclick = openQr;
$('#qrClose').onclick = closeMask;
$('#favClose').onclick = closeMask;
$('#mask').onclick = e => { if (e.target === $('#mask')) closeMask(); };

const es = new EventSource('/api/events');
es.onmessage = e => {
  const s = JSON.parse(e.data);
  snap = s; playing = !!(s.player && s.player.playing);
  basePos = (s.player && s.player.pos) || 0; baseAt = performance.now();
  render(s); tick();
  renderAccount(s.account && s.account.login ? s.account : {login:false});
};
es.onerror = () => { $('#mode').textContent = '断线重连中…'; };

refreshAuth();
</script>
</body>
