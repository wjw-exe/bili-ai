<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bili-ai · 后台</title>
<style>
  :root{
    /* 分层深色：底层 → 面板 → 次级面板 → 控件（B站深色 + 流媒体 dashboard 分层） */
    --bg:#0a0c10;
    --surface:#111419;
    --surface-2:#151920;
    --surface-3:#1a1f27;
    --line:#242a35;
    --line-soft:rgba(255,255,255,.065);
    --text:#e8ecf4;
    --text-2:#aab3c5;
    --dim:#79839a;
    --muted:#4b5464;
    --pink:#fb7299;
    --pink-soft:rgba(251,114,153,.14);
    --blue:#00aeec;
    --ok:#3ddc97;
    --warn:#ffb84d;
    --err:#ff7b7b;
    --r-sm:8px; --r-md:10px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(0,0,0,.45);
    --sh-2:0 6px 20px -8px rgba(0,0,0,.6);
    --sh-3:0 24px 60px -16px rgba(0,0,0,.8);
    --ease:cubic-bezier(.4,0,.2,1);
    --ring:0 0 0 3px rgba(0,174,236,.25);
    --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
        radial-gradient(1100px 520px at 8% -12%, rgba(0,174,236,.10), transparent 62%),
        radial-gradient(900px 460px at 102% -6%, rgba(251,114,153,.09), transparent 58%),
        var(--bg);
       color:var(--text);font:14px/1.55 var(--font);
       height:100vh;display:flex;flex-direction:column;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid rgba(0,174,236,.7);outline-offset:2px}
  header{position:relative;z-index:20;flex:none;display:flex;align-items:center;gap:12px;
         height:56px;padding:0 18px;border-bottom:1px solid var(--line-soft);
         background:rgba(17,20,25,.78);backdrop-filter:blur(14px) saturate(1.2)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;opacity:.55;
         background:linear-gradient(90deg,transparent 5%,rgba(251,114,153,.55) 35%,rgba(0,174,236,.55) 65%,transparent 95%)}
  .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:.2px}
  .logo::before{content:"";width:9px;height:9px;border-radius:3px;flex:none;
         background:linear-gradient(135deg,var(--pink),#ffa8c1);box-shadow:0 0 10px rgba(251,114,153,.65)}
  .logo b{font-weight:700;background:linear-gradient(90deg,var(--pink),#ffa8c1);
         -webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:999px;
         font-size:11.5px;font-weight:500;background:var(--surface-2);border:1px solid var(--line);
         color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;
         transition:color .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease)}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;
         opacity:.6;box-shadow:0 0 6px currentColor;flex:none}
  .badge.on{color:var(--ok);border-color:rgba(61,220,151,.32);background:rgba(61,220,151,.09)}
  .badge.pink{color:var(--pink);border-color:rgba(251,114,153,.34);background:var(--pink-soft)}
  .spacer{flex:1}
  .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* 账号 */
  .acct{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 10px;border:1px solid var(--line);
        border-radius:999px;background:var(--surface-2);font-size:12px;
        transition:border-color .16s var(--ease)}
  .acct:hover{border-color:rgba(255,255,255,.14)}
  .acct img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#080a0d;
        box-shadow:0 0 0 1px rgba(255,255,255,.1)}
  .acct .nm{color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct button{color:var(--dim);font-size:11px;padding:3px 9px;border-radius:999px;
        border:1px solid transparent;transition:all .16s var(--ease)}
  .acct button:hover{color:var(--text);border-color:var(--line);background:rgba(255,255,255,.04)}
  .btn-login{padding:6px 15px;border-radius:999px;background:linear-gradient(180deg,#ff88ab,var(--pink));
        color:#261216;font-weight:600;font-size:12.5px;box-shadow:0 4px 14px -6px rgba(251,114,153,.85);
        transition:filter .16s var(--ease),transform .16s var(--ease)}
  .btn-login:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .btn-login:active{transform:translateY(0)}

  main{flex:1;display:grid;grid-template-columns:minmax(320px,392px) minmax(0,1fr) 336px;
       gap:14px;padding:14px;min-height:0}
  .panel{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;
       background:linear-gradient(180deg,var(--surface-2),var(--surface));
       border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
  .panel::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
       background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
  .panel h2{display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:600;color:var(--dim);
       letter-spacing:.16em;text-transform:uppercase;padding:13px 16px;
       border-bottom:1px solid var(--line-soft);flex:none}
  .panel h2::before{content:"";width:3px;height:11px;border-radius:2px;flex:none;
       background:linear-gradient(180deg,var(--pink),#ffa8c1);box-shadow:0 0 8px rgba(251,114,153,.6)}

  /* 播放器 */
  .cover{position:relative;width:100%;aspect-ratio:16/9;background:#07090c;overflow:hidden;flex:none}
  .cover::after{content:"";position:absolute;inset:0;pointer-events:none;
       background:linear-gradient(180deg,transparent 52%,rgba(7,9,12,.66))}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
       color:#39414f;font-size:12.5px;letter-spacing:.05em}
  .cover .badge{position:absolute;left:12px;top:12px;z-index:2;background:rgba(9,11,15,.62);
       backdrop-filter:blur(8px);border-color:rgba(255,255,255,.14);color:var(--text-2)}
  .pbody{padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
  .ptitle{font-size:15px;font-weight:600;line-height:1.45;letter-spacing:.01em;
       max-height:2.9em;overflow:hidden}
  .pup{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .bar{height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:0;border-radius:999px;
       background:linear-gradient(90deg,#fb7299,#ffb0c6);
       box-shadow:0 0 12px rgba(251,114,153,.6);transition:width .18s linear}
  .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
       font-family:var(--mono);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
  .stat{background:var(--surface-3);border:1px solid var(--line-soft);border-radius:var(--r-md);
       padding:8px 10px;transition:border-color .16s var(--ease),background .16s var(--ease)}
  .stat:hover{border-color:rgba(255,255,255,.13);background:#1f242d}
  .stat b{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--dim);letter-spacing:.04em}

  /* 互动 */
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .act{padding:8px 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-3);
       font-size:12px;font-weight:500;color:var(--text-2);text-align:center;
       transition:all .16s var(--ease)}
  .act:hover{border-color:rgba(255,255,255,.16);color:var(--text);background:#232832;transform:translateY(-1px)}
  .act:active{transform:translateY(0)}
  .act.on{color:var(--pink);border-color:rgba(251,114,153,.45);background:var(--pink-soft);
       box-shadow:inset 0 0 0 1px rgba(251,114,153,.12),0 5px 16px -8px rgba(251,114,153,.75)}
  .act:disabled{opacity:.4;cursor:not-allowed;transform:none}

  /* 字幕 */
  .subbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line-soft);
       font-size:12px;color:var(--dim);flex-wrap:wrap;flex:none;background:rgba(0,0,0,.14)}
  .subbar select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);
       padding:5px 8px;font:inherit;font-size:12px;outline:none;max-width:160px;
       transition:border-color .16s var(--ease)}
  .subbar select:hover{border-color:rgba(255,255,255,.16)}
  .subbar button{padding:5px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;
       color:var(--text-2);background:var(--surface-3);transition:all .16s var(--ease)}
  .subbar button:hover:not(:disabled){border-color:rgba(255,255,255,.18);color:var(--text);background:#242a34}
  .subbar button:disabled{opacity:.35;cursor:not-allowed}
  .subbar #subMeta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .subt{overflow:auto;flex:1;padding:12px 16px;font-size:13px;line-height:1.65}
  .subt .cue{display:flex;gap:12px;padding:3px 0;border-radius:6px}
  .subt .cue:hover{background:rgba(255,255,255,.035)}
  .subt .cue .ts{color:var(--pink);font-family:var(--mono);font-size:11px;
       font-variant-numeric:tabular-nums;flex:none;min-width:46px;padding-top:3px;opacity:.9}
  .subt .cue .tx{word-break:break-word;color:#d6dce8}
  .subt .hint{font-size:11.5px;color:var(--muted);padding:8px 0}

  /* 列表 / 评论 */
  .tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line-soft);
       background:rgba(0,0,0,.14);flex:none}
  .tab{padding:6px 14px;font-size:12.5px;font-weight:500;color:var(--dim);border-radius:999px;
       border-bottom:none;transition:all .16s var(--ease)}
  .tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .tab.cur{color:var(--pink);background:var(--pink-soft);border-bottom-color:transparent;
       box-shadow:inset 0 0 0 1px rgba(251,114,153,.3)}
  .pane{overflow:auto;flex:1;display:none}
  .pane.cur{display:block}
  .row{position:relative;display:flex;gap:12px;padding:11px 16px;align-items:center;cursor:default;
       border-bottom:1px solid rgba(255,255,255,.035);transition:background .14s var(--ease)}
  .row:hover{background:rgba(255,255,255,.045)}
  .row.cur{background:linear-gradient(90deg,var(--pink-soft),transparent 72%)}
  .row.cur::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
       background:var(--pink);box-shadow:0 0 10px rgba(251,114,153,.7)}
  .idx{width:22px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
  .thumb{width:96px;aspect-ratio:16/9;border-radius:var(--r-sm);background:#07090c;object-fit:cover;flex:none;
       box-shadow:0 0 0 1px rgba(255,255,255,.06),var(--sh-1)}
  .info{min-width:0;flex:1}
  .t{font-size:13px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;
       -webkit-line-clamp:2;overflow:hidden;word-break:break-word;color:#e2e8f2}
  .sub{font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bvid{font-family:var(--mono);font-size:10.5px;color:#6d7789;background:rgba(255,255,255,.05);
       padding:1px 6px;border-radius:4px}
  .empty{color:var(--muted);text-align:center;padding:44px 16px;font-size:12.5px;letter-spacing:.02em}

  .cmt{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.035);transition:background .14s var(--ease)}
  .cmt:hover{background:rgba(255,255,255,.04)}
  .cmt .h{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--dim)}
  .cmt .h b{color:var(--text-2);font-weight:600;font-size:12.5px}
  .cmt .h .lk{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px}
  .cmt .m{margin-top:5px;font-size:13px;line-height:1.6;word-break:break-word;color:#dbe1ec}
  .cmtbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line-soft);
       font-size:11.5px;color:var(--dim);flex:none;background:rgba(0,0,0,.14);font-variant-numeric:tabular-nums}
  .cmtbar button{padding:5px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
       color:var(--text-2);transition:all .16s var(--ease)}
  .cmtbar button:hover:not(:disabled){border-color:rgba(255,255,255,.18);color:var(--text);background:#242a34}
  .cmtbar button:disabled{opacity:.35;cursor:not-allowed}
  .cmtbox{display:flex;gap:8px;align-items:flex-end;padding:11px 16px;border-top:1px solid var(--line-soft);flex:none}
  .cmtbox textarea{flex:1;resize:vertical;min-height:46px;padding:9px 11px;border-radius:var(--r-md);
       border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;
       outline:none;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
  .cmtbox textarea::placeholder{color:var(--muted)}
  .cmtbox textarea:focus{border-color:rgba(0,174,236,.55);box-shadow:var(--ring)}
  .cmtbox button{padding:9px 18px;border:1px solid var(--line);border-radius:var(--r-md);
       background:var(--surface-3);font-size:12.5px;font-weight:500;transition:all .16s var(--ease)}
  .cmtbox button:hover{border-color:rgba(0,174,236,.45);color:#8fdcff;background:#1c2630}

  /* 日志 */
  .log{overflow:auto;flex:1;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.5}
  .l{display:flex;gap:8px;padding:4px 6px;border-radius:6px;transition:background .14s var(--ease)}
  .l:hover{background:rgba(255,255,255,.045)}
  .l .lt{color:#5c6678;flex:none;font-variant-numeric:tabular-nums}
  .l .c{color:#8fb6ff;flex:none}
  .l.bad .c{color:var(--err)}
  .l .s{color:#b8c1d1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{font-size:10.5px;color:#3f4756;text-align:center;padding:7px;letter-spacing:.03em;
       border-top:1px solid rgba(255,255,255,.03);flex:none}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(5,7,10,.74);backdrop-filter:blur(6px);
       display:none;align-items:center;justify-content:center;z-index:50}
  .mask.cur{display:flex}
  .dlg{position:relative;overflow:hidden;width:336px;padding:22px 22px 20px;border-radius:16px;
       background:linear-gradient(180deg,var(--surface-2),var(--surface));
       border:1px solid rgba(255,255,255,.09);box-shadow:var(--sh-3);
       display:flex;flex-direction:column;gap:14px;align-items:center}
  .dlg::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
       background:linear-gradient(90deg,transparent,rgba(251,114,153,.6),rgba(0,174,236,.5),transparent)}
  .dlg h3{font-size:14px;font-weight:600;letter-spacing:.02em}
  .dlg .qbox{width:224px;height:224px;background:#fff;border-radius:var(--r-md);display:flex;
       align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 24px -12px rgba(0,0,0,.9)}
  .dlg .qbox img{width:100%;height:100%;object-fit:contain}
  .dlg .tip{font-size:12px;color:var(--dim);text-align:center;min-height:18px}
  .dlg .tip.ok{color:var(--ok)} .dlg .tip.bad{color:var(--err)}
  .dlg .row2{display:flex;gap:8px}
  .dlg .row2 button{padding:7px 15px;border:1px solid var(--line);border-radius:var(--r-sm);
       font-size:12.5px;color:var(--text-2);background:var(--surface-3);transition:all .16s var(--ease)}
  .dlg .row2 button:hover{border-color:rgba(255,255,255,.18);color:var(--text);background:#242a34}
  .folders{width:100%;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .folders button{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
       font-size:13px;color:var(--text-2);background:var(--surface-3);transition:all .16s var(--ease)}
  .folders button:hover{border-color:rgba(251,114,153,.5);color:var(--pink);background:var(--pink-soft)}

  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);
       background:rgba(28,33,42,.96);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);
       color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--sh-3);
       opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);
       z-index:99;max-width:70vw}
  #toast.cur{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,123,123,.4);color:#ffb8b8}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2c3340;border-radius:999px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#3b4455;background-clip:content-box;border:2px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:1460px){
    main{grid-template-columns:minmax(300px,340px) minmax(0,1fr) 300px}
  }
  @media (max-width:1180px){
    body{overflow:auto}
    main{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(320px,auto);min-height:0}
    .panel{min-height:320px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">bili<b>-ai</b></div>
  <span class="badge" id="view">idle</span>
  <span class="badge" id="mode">观察模式</span>
  <div class="spacer"></div>
  <div class="meta" id="meta">—</div>
  <div id="acct"></div>
</header>

<main>
  <section class="panel">
    <h2>Now Playing</h2>
    <div class="cover">
      <div class="ph" id="coverPh">逻辑播放 · 无解码器</div>
      <img id="cover" style="display:none" alt="">
      <span class="badge" id="pstate">idle</span>
    </div>
    <div class="pbody">
      <div class="ptitle" id="ptitle">尚未打开视频</div>
      <div class="pup" id="pup">—</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="times"><span id="tcur">00:00</span><span id="tdur">00:00</span></div>
      <div class="stats" id="stats"></div>
      <div class="acts">
        <button class="act" id="btnLike" data-act="like">点赞</button>
        <button class="act" id="btnCoin" data-act="coin">投币</button>
        <button class="act" id="btnFav" data-act="fav">收藏</button>
        <button class="act" id="btnCmt" data-act="comments">评论</button>
      </div>
    </div>
    <div class="foot">进度由服务端时钟推进 · 0.35s 同步</div>
  </section>

  <section class="panel">
    <div class="tabs">
      <button class="tab cur" id="tabList">搜索结果</button>
      <button class="tab" id="tabCmt">评论</button>
      <button class="tab" id="tabSub">字幕</button>
    </div>
    <div class="pane cur" id="list"><div class="empty">等待 search 命令</div></div>
    <div class="pane" id="cmts"><div class="empty">尚未加载评论</div></div>
    <div class="pane" id="subs">
      <div class="subbar">
        <select id="subLang" title="字幕轨"></select>
        <button id="subLoad">读取</button>
        <button id="subMore" disabled>加载更多</button>
        <button id="subExport">导出 txt</button>
        <span id="subMeta">—</span>
      </div>
      <div class="subt" id="subBody"><div class="empty">点「读取」拉取当前视频字幕</div></div>
    </div>
    <div class="cmtbox" id="cmtbox" style="display:none">
      <textarea id="cmtInput" rows="2" maxlength="1000" placeholder="写下你的评论…（Ctrl+Enter 发送）"></textarea>
      <button id="cmtSend">发送</button>
    </div>
    <div class="cmtbar" id="cmtbar" style="display:none">
      <span id="cmtMeta">—</span>
      <div class="spacer"></div>
      <button id="cmtPrev">上一页</button>
      <button id="cmtNext">下一页</button>
    </div>
  </section>

  <section class="panel">
    <h2>Command Log</h2>
    <div class="log" id="log"><div class="empty">—</div></div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="dlg" id="dlgQr">
    <h3>扫码登录</h3>
    <div class="qbox"><img id="qrImg" alt="二维码"></div>
    <div class="tip" id="qrTip">正在申请二维码…</div>
    <div class="row2"><button id="qrRefresh">刷新二维码</button><button id="qrClose">关闭</button></div>
  </div>
  <div class="dlg" id="dlgFav" style="display:none">
    <h3>选择收藏夹</h3>
    <div class="folders" id="folderList"></div>
    <div class="row2"><button id="favClose">取消</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CN = n => n >= 1e8 ? (n/1e8).toFixed(1)+'亿' : n >= 1e4 ? (n/1e4).toFixed(1)+'万' : String(n||0);
const HMS = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h? h+':' : '') + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };
const IMG = u => u ? '/api/thumb?u=' + encodeURIComponent(u.startsWith('//') ? 'https:'+u : u) : '';
function esc(s){ return String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

let snap = null, basePos = 0, baseAt = 0, playing = false, lastBvid = '';
let tab = 'list', cmtPage = 1;

function tick(){
  if (!snap) return;
  const p = snap.player || {};
  let pos = p.pos || 0;
  if (playing && p.dur) pos = Math.min(p.dur, pos + (performance.now() - baseAt)/1000);
  $('#tcur').textContent = HMS(pos);
  $('#tdur').textContent = HMS(p.dur);
  $('#bar').style.width = p.dur ? Math.min(100, pos/p.dur*100) + '%' : '0%';
}
setInterval(tick, 200);

/* ---------- 请求 ---------- */
async function api(path, body){
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}
let toastT = null;
function toast(msg, bad){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'cur' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = '', 2600);
}
async function cmd(name, args){
  const j = await api('/api/cmd', {name, args: args||{}});
  if (!j.ok) toast(j.out.split('\n')[0], true);
  else toast(j.out.split('\n')[0]);
  return j;
}

/* ---------- 账号 ---------- */
let qrTimer = null, qrKey = null;

function renderAccount(a){
  a = a || {};
  const box = $('#acct');
  if (a.login){
    box.innerHTML = `
      <div class="acct">
        ${a.avatar ? `<img src="${IMG(a.avatar)}" alt="">` : ''}
        <span class="nm">${esc(a.uname)}</span>
        <button id="btnLogout">退出</button>
      </div>`;
    $('#btnLogout').onclick = async () => {
      await api('/api/auth/logout', {});
      toast('已退出登录');
      refreshAuth();
    };
  } else {
    box.innerHTML = '<button class="btn-login" id="btnLogin">扫码登录</button>';
    $('#btnLogin').onclick = openQr;
  }
}

async function refreshAuth(){
  try {
    const info = await api('/api/auth');
    renderAccount(info.is_login ? {login:true, uname:info.uname, mid:info.mid, avatar:info.avatar} : {login:false});
  } catch (e) { /* 网络异常时保留上次渲染 */ }
}

function closeMask(){
  $('#mask').className = 'mask';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
}

async function openQr(){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  $('#qrTip').className = 'tip';
  $('#qrTip').textContent = '正在申请二维码…';
  $('#qrImg').removeAttribute('src');
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  const r = await api('/api/auth/qr', {});
  if (!r.ok){ $('#qrTip').textContent = r.msg || '申请失败'; $('#qrTip').className='tip bad'; return; }
  qrKey = r.key;
  $('#qrImg').src = r.png;
  $('#qrTip').textContent = '用手机 B 站客户端扫一扫';
  qrTimer = setInterval(pollQr, 1600);
}

async function pollQr(){
  if (!qrKey) return;
  let r;
  try { r = await api('/api/auth/poll?key=' + encodeURIComponent(qrKey)); }
  catch (e) { return; }
  const tip = $('#qrTip');
  if (r.status === 'scanned'){ tip.textContent = '已扫码，请在手机上确认登录'; tip.className = 'tip'; }
  else if (r.status === 'expired'){
    tip.textContent = '二维码已失效，点「刷新二维码」重试'; tip.className = 'tip bad';
    clearInterval(qrTimer); qrTimer = null;
  } else if (r.status === 'ok'){
    tip.textContent = '登录成功：' + (r.uname || '') ; tip.className = 'tip ok';
    clearInterval(qrTimer); qrTimer = null;
    toast('登录成功：' + (r.uname || ''));
    setTimeout(() => { closeMask(); refreshAuth(); }, 700);
  } else {
    tip.textContent = '等待扫码…';
  }
}

/* ---------- 互动 ---------- */
function renderInter(s){
  const it = s.inter || {};
  const cur = s.current;
  const login = (s.account || {}).login;
  const on = v => v === true ? ' on' : '';
  const like = $('#btnLike'), coin = $('#btnCoin'), fav = $('#btnFav'), cmt = $('#btnCmt');
  like.textContent = it.liked === true ? '已赞' : (it.liked === false ? '点赞' : '点赞');
  like.className = 'act' + on(it.liked);
  coin.textContent = it.coins ? ('已投 ' + it.coins) : '投币';
  coin.className = 'act' + (it.coins ? ' on' : '');
  fav.textContent = it.favoured === true ? '已收藏' : '收藏';
  fav.className = 'act' + on(it.favoured);
  [like, coin, fav].forEach(b => b.disabled = !cur);
  cmt.disabled = !cur;
  cmt.className = 'act' + (tab === 'cmt' ? ' on' : '');
}

$('#btnLike').onclick = async () => {
  const it = (snap && snap.inter) || {};
  await cmd('like', {on: !(it.liked === true)});
};
$('#btnCoin').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.coins > 0) return toast('该视频已投过币');
  await cmd('coin', {n: 2, also_like: false});
};
$('#btnFav').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.favoured === true) return cmd('unfav', {});
  const r = await fetch('/api/folders').then(x => x.json());
  if (!r.ok){
    toast(r.msg || '读取收藏夹失败', true);
    if (r.need_login) openQr();
    return;
  }
  if (!r.items.length) return toast('账号下没有收藏夹', true);
  showFolders(r.items);
};
$('#btnCmt').onclick = () => { switchTab('cmt'); loadComments(1); };

function showFolders(items){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'none';
  $('#dlgFav').style.display = 'flex';
  $('#folderList').innerHTML = items.map(f =>
    `<button data-id="${f.id}">${esc(f.title)} <span style="color:var(--dim);font-size:11px">${f.count}</span></button>`
  ).join('');
  $('#folderList').querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      closeMask();
      await cmd('fav', {folder: b.dataset.id});
    };
  });
}

/* ---------- 评论 ---------- */
function switchTab(t){
  tab = t;
  [['list','#tabList','#list'],['cmt','#tabCmt','#cmts'],['sub','#tabSub','#subs']].forEach(([k,tid,pid]) => {
    const te = $(tid), pe = $(pid);
    if (te) te.className = 'tab' + (t === k ? ' cur' : '');
    if (pe) pe.className = 'pane' + (t === k ? ' cur' : '');
  });
  $('#cmtbar').style.display = t === 'cmt' ? 'flex' : 'none';
  $('#cmtbox').style.display = t === 'cmt' && !!(snap || {}).current ? 'flex' : 'none';
  renderInter(snap || {});
}
$('#tabList').onclick = () => switchTab('list');
$('#tabCmt').onclick = () => { switchTab('cmt'); if (!((snap||{}).comments||[]).length) loadComments(1); };

async function sendComment(){
  const el = $('#cmtInput');
  const msg = (el.value || '').trim();
  if (!msg) return toast('评论内容不能为空', true);
  const j = await cmd('comment', {message: msg});
  if (!j.ok) return;
  el.value = '';
  await loadComments(1);
}
$('#cmtSend').onclick = sendComment;
$('#cmtInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendComment(); }
});

async function loadComments(page){
  const j = await cmd('comments', {page, limit: 20});
  if (j.ok) cmtPage = page;
}

async function refreshComments(){
  const j = await cmd('comments', {page: cmtPage, limit: 20});
  return j.ok;
}

$('#cmtPrev').onclick = () => { if (cmtPage > 1) loadComments(cmtPage - 1); };
$('#cmtNext').onclick = () => loadComments(cmtPage + 1);

function renderComments(s){
  const list = s.comments || [], meta = s.comments_meta || {};
  const box = $('#cmts');
  $('#cmtbox').style.display = (tab === 'cmt' && s.current) ? 'flex' : 'none';
  if (!list.length){
    box.innerHTML = '<div class="empty">尚未加载评论</div>';
    $('#cmtMeta').textContent = '—';
    $('#cmtPrev').disabled = true; $('#cmtNext').disabled = true;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="cmt">
      <div class="h"><b>${esc(c.uname)}</b><span class="lk">赞 ${CN(c.like)}${c.sub ? ' · 回复 '+CN(c.sub) : ''}</span></div>
      <div class="m">${esc(c.msg)}</div>
    </div>`).join('');
  $('#cmtMeta').textContent = `第 ${meta.page||1} 页 · 共 ${CN(meta.total||0)} 条` + (meta.is_end ? ' · 已到末页' : '');
  $('#cmtPrev').disabled = (meta.page||1) <= 1;
  $('#cmtNext').disabled = !!meta.is_end;
}

/* ---------- 字幕 ---------- */
let subLang = '', subOffset = 0, subDone = false, subLoading = false;

function parseSubTracks(out){
  const tracks = [];
  out.split('\n').forEach(ln => {
    const m = ln.match(/lan=(\S+)\s+(.*?)\s+ai=(\d)\s+lock=(\d)/);
    if (m) tracks.push({lan:m[1], doc:m[2], ai:m[3]==='1', lock:m[4]==='1'});
  });
  return tracks;
}

async function loadSubTracks(){
  const j = await cmd('subtitles', {});
  if (!j.ok) return false;
  const tracks = parseSubTracks(j.out);
  const sel = $('#subLang');
  if (!tracks.length){
    sel.innerHTML = '<option>无字幕轨</option>';
    $('#subBody').innerHTML = '<div class="empty">该视频没有平台字幕（画面内嵌硬字幕无法获取）</div>';
    $('#subMeta').textContent = '0 轨';
    subLang = '';
    return false;
  }
  sel.innerHTML = tracks.map(t =>
    `<option value="${esc(t.lan)}">${esc(t.doc||t.lan)}${t.ai?' · AI':''}${t.lock?' · 需解锁':''}</option>`).join('');
  const usable = tracks.find(t => !t.lock && t.lan === 'ai-zh')
    || tracks.find(t => !t.lock && /^zh/i.test(t.lan))
    || tracks.find(t => !t.lock) || tracks[0];
  sel.value = usable.lan; subLang = usable.lan;
  $('#subMeta').textContent = tracks.length + ' 轨';
  return true;
}

async function loadSubs(reset){
  if (subLoading) return;
  subLoading = true;
  const body = $('#subBody');
  try {
    if (reset){ subOffset = 0; subDone = false; body.innerHTML = ''; }
    const j = await cmd('subtitle', {lang: subLang, offset: subOffset, limit: 300});
    if (!j.ok) return;
    const lines = j.out.split('\n');
    const head = lines[0] || '';
    const cues = [];
    lines.slice(1).forEach(ln => {
      const m = ln.match(/^\[(\d+:\d{2})\]\s(.*)$/);
      if (m) cues.push({ts:m[1], tx:m[2]});
    });
    body.insertAdjacentHTML('beforeend', cues.map(c =>
      `<div class="cue"><span class="ts">${c.ts}</span><span class="tx">${esc(c.tx)}</span></div>`).join(''));
    const nx = (j.out.match(/next: subtitle --offset (\d+)/) || [])[1];
    if (nx){ subOffset = parseInt(nx, 10); $('#subMore').disabled = false; }
    else { subDone = true; $('#subMore').disabled = true; }
    const cm = head.match(/cues=(\d+)\s+chars=(\d+)/);
    $('#subMeta').textContent = subLang + (cm ? ` · ${cm[1]} 句 / ${cm[2]} 字` : '')
      + (subDone ? ' · 已到末尾' : ` · 已读至 ${subOffset}`);
    if (!cues.length && reset) body.innerHTML = '<div class="empty">字幕内容为空</div>';
    body.scrollTop = body.scrollHeight;
  } finally { subLoading = false; }
}

async function exportSubs(){
  const j = await cmd('subtitle', {lang: subLang, export:'txt'});
  if (j.ok){
    const m = j.out.match(/path=(.+)/);
    toast('已导出：' + (m ? m[1].trim() : 'ok'));
  }
}

$('#tabSub').onclick = async () => {
  switchTab('sub');
  if (!(snap||{}).current) return toast('先打开一个视频', true);
  if (!subLang){
    const ok = await loadSubTracks();
    if (ok) await loadSubs(true);
  }
};
$('#subLang').onchange = () => { subLang = $('#subLang').value; loadSubs(true); };
$('#subLoad').onclick = async () => {
  if (!subLang && !await loadSubTracks()) return;
  await loadSubs(true);
};
$('#subMore').onclick = () => loadSubs(false);
$('#subExport').onclick = async () => {
  if (!subLang && !await loadSubTracks()) return;
  exportSubs();
};

/* ---------- 主渲染 ---------- */
function render(s){
  const p = s.player || {}, c = s.current;

  $('#view').textContent = 'view: ' + (s.view || 'idle');
  $('#view').className = 'badge' + (s.view === 'video' ? ' pink' : s.view === 'search' ? ' on' : '');
  $('#mode').textContent = s.readonly ? 'MCP 模式' : 'serve 模式';
  $('#meta').textContent = 'uptime ' + Math.floor(s.uptime||0) + 's · total ' + CN(s.total||0);

  if (c && c.bvid !== lastBvid){
    lastBvid = c.bvid; subLang = ''; subOffset = 0; subDone = false;
    $('#subLang').innerHTML = ''; $('#subMore').disabled = true;
    $('#subMeta').textContent = '—';
    $('#subBody').innerHTML = '<div class="empty">点「读取」拉取当前视频字幕</div>';
  }
  if (c){
    $('#ptitle').textContent = c.title || '—';
    $('#pup').textContent = (c.up||'') + (c.mid ? ' · mid '+c.mid : '') + (c.dur ? ' · '+HMS(c.dur) : '');
    if (c.pic){ $('#cover').src = IMG(c.pic); $('#cover').style.display='block'; $('#coverPh').style.display='none'; }
    $('#stats').innerHTML = [
      ['播放', CN(c.view)], ['点赞', CN(c.like)], ['投币', CN(c.coin)],
      ['收藏', CN(c.fav)], ['弹幕', CN(c.danmaku)], ['评论', CN(c.reply)]
    ].map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  } else {
    $('#ptitle').textContent = '尚未打开视频';
    $('#pup').textContent = '—'; $('#stats').innerHTML = '';
    $('#cover').style.display='none'; $('#coverPh').style.display='flex'; $('#coverPh').textContent='逻辑播放 · 无解码器';
  }
  $('#pstate').textContent = p.bvid ? (p.playing ? 'playing' : 'paused') : 'idle';
  $('#pstate').className = 'badge' + (p.playing ? ' on' : '');

  const items = s.items || [];
  $('#tabList').textContent = s.view === 'search' ? `搜索结果 (${items.length})` : s.view === 'video' ? '详情' : '搜索结果';
  if (items.length){
    $('#list').innerHTML = items.map((it,i) => `
      <div class="row ${p.bvid === it.bvid ? 'cur' : ''}">
        <div class="idx">${i+1}</div>
        ${it.pic ? `<img class="thumb" src="${IMG(it.pic)}" loading="lazy" alt="">` : '<div class="thumb"></div>'}
        <div class="info">
          <div class="t">${esc(it.title)}</div>
          <div class="sub"><span class="bvid">${it.bvid}</span><span>${it.dur}</span><span>${CN(it.play)} 播放</span><span>${esc(it.up)}</span></div>
        </div>
      </div>`).join('');
  } else if (s.view === 'idle'){
    $('#list').innerHTML = '<div class="empty">等待 search 命令</div>';
  } else {
    $('#list').innerHTML = '<div class="empty">无数据（可能命中风控）</div>';
  }

  renderComments(s);
  renderInter(s);

  const log = s.log || [];
  $('#log').innerHTML = log.length ? log.map(l =>
    `<div class="l ${l.ok?'':'bad'}" title="${esc(l.cmd)} · ${esc(l.summary)}"><span class="lt">${l.t}</span><span class="c">${esc(l.cmd)}</span><span class="s">${esc(l.summary)}</span></div>`
  ).join('') : '<div class="empty">—</div>';
}

$('#qrRefresh').onclick = openQr;
$('#qrClose').onclick = closeMask;
$('#favClose').onclick = closeMask;
$('#mask').onclick = e => { if (e.target === $('#mask')) closeMask(); };

const es = new EventSource('/api/events');
es.onmessage = e => {
  const s = JSON.parse(e.data);
  snap = s; playing = !!(s.player && s.player.playing);
  basePos = (s.player && s.player.pos) || 0; baseAt = performance.now();
  render(s); tick();
  renderAccount(s.account && s.account.login ? s.account : {login:false});
};
es.onerror = () => { $('#mode').textContent = '断线重连中…'; };

refreshAuth();
</script>
</body>
</html>
