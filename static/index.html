<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bili-ai · 后台</title>
<style>
  :root{
    /* 明色中性层级：页面底 / 卡片 / 次级面 / 控件面 */
    --bg:#f5f6f7;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --surface-3:#f2f3f5;
    --line:#e3e5e8;
    --line-strong:#d5d8dd;
    --text:#18191c;
    --text-2:#3d4149;
    --dim:#61666d;
    --muted:#9499a0;
    --blue:#00aeec;
    --blue-dark:#0095cc;
    --blue-soft:#e6f6fd;
    --pink:#fb7299;
    --ok:#12845c;
    --warn:#b26a00;
    --err:#d9363e;
    --r-sm:4px; --r-md:6px; --r-lg:8px;
    --ease:ease;
    --font:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    --mono:Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.55 var(--font);
       height:100vh;display:flex;flex-direction:column;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible,select:focus-visible,textarea:focus-visible{
       outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  header{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;
       background:var(--surface);border-bottom:1px solid var(--line)}
  .logo{font-size:15px;font-weight:600;letter-spacing:0}
  .logo b{font-weight:600;color:var(--pink)}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
       border-radius:var(--r-sm);font-size:11px;font-weight:400;line-height:1;
       background:var(--surface-3);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none}
  .badge.on{color:var(--ok);border-color:#bfe3d5;background:#f1faf6}
  .badge.on::before{background:var(--ok)}
  .badge.pink{color:var(--pink);border-color:#fbd5e0;background:#fef3f6}
  .badge.pink::before{background:var(--pink)}
  .spacer{flex:1}
  .meta{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 账号 */
  .acct{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 8px;border:1px solid var(--line);
        border-radius:var(--r-md);background:var(--surface);font-size:12px}
  .acct img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--surface-3);
        border:1px solid var(--line)}
  .acct .nm{color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct button{color:var(--dim);font-size:11px;padding:3px 8px;border-radius:var(--r-sm);
        border:1px solid transparent}
  .acct button:hover{color:var(--text);border-color:var(--line);background:var(--surface-3)}
  .btn-login{padding:5px 14px;border-radius:var(--r-md);background:var(--blue);color:#fff;
        font-weight:500;font-size:12.5px}
  .btn-login:hover{background:var(--blue-dark)}

  main{flex:1;display:grid;grid-template-columns:minmax(320px,392px) minmax(0,1fr) 336px;
       gap:12px;padding:12px;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;
       background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
  .panel h2{flex:none;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.02em;
       padding:10px 14px;border-bottom:1px solid var(--line)}

  /* 播放器 */
  .cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden;flex:none}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
       color:var(--muted);font-size:12.5px}
  .cover .badge{position:absolute;left:10px;top:10px;z-index:2;background:rgba(0,0,0,.55);
       border-color:rgba(255,255,255,.22);color:#fff}
  .cover .badge::before{background:#fff}
  .pbody{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .ptitle{font-size:14.5px;font-weight:600;line-height:1.45;max-height:2.9em;overflow:hidden;
       color:var(--text)}
  .pup{font-size:12px;color:var(--dim)}
  .bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .18s linear}
  .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
       font-family:var(--mono);font-variant-numeric:tabular-nums}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:7px 9px}
  .stat b{display:block;font-size:13px;font-weight:600;color:var(--text);
       font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim)}

  /* 互动 */
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
  .act{padding:7px 0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
       font-size:12px;color:var(--dim);text-align:center;transition:all .15s var(--ease)}
  .act:hover{border-color:var(--line-strong);color:var(--text);background:var(--surface-2)}
  .act.on{color:var(--blue-dark);border-color:#a9e2f7;background:var(--blue-soft)}
  .act:disabled{opacity:.45;cursor:not-allowed}

  /* 字幕 */
  .subbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);
       font-size:12px;color:var(--dim);flex-wrap:wrap;flex:none}
  .subbar select{background:var(--surface);color:var(--text);border:1px solid var(--line);
       border-radius:var(--r-md);padding:4px 6px;font:inherit;font-size:12px;outline:none;max-width:160px}
  .subbar button{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-md);
       font-size:12px;color:var(--text-2);background:var(--surface)}
  .subbar button:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
  .subbar button:disabled{opacity:.45;cursor:not-allowed}
  .subbar #subMeta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .subt{overflow:auto;flex:1;padding:10px 14px;font-size:13px;line-height:1.65}
  .subt .cue{display:flex;gap:12px;padding:2px 0}
  .subt .cue .ts{color:var(--muted);font-family:var(--mono);font-size:11px;
       font-variant-numeric:tabular-nums;flex:none;min-width:44px;padding-top:3px}
  .subt .cue .tx{word-break:break-word;color:var(--text-2)}
  .subt .hint{font-size:11.5px;color:var(--muted);padding:8px 0}

  /* 列表 / 评论 */
  .tabs{display:flex;gap:0;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
  .tab{position:relative;padding:9px 12px;font-size:12.5px;color:var(--dim);
       border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0}
  .tab:hover{color:var(--text)}
  .tab.cur{color:var(--blue-dark);border-bottom-color:var(--blue);background:none;box-shadow:none}
  .pane{overflow:auto;flex:1;display:none}
  .pane.cur{display:block}
  .row{display:flex;gap:10px;padding:10px 14px;align-items:center;cursor:default;
       border-bottom:1px solid var(--line);transition:background .12s var(--ease)}
  .row:hover{background:var(--surface-2)}
  .row.cur{background:var(--blue-soft);box-shadow:inset 2px 0 0 var(--blue)}
  .idx{width:20px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
  .thumb{width:92px;aspect-ratio:16/9;border-radius:var(--r-sm);background:var(--surface-3);
       object-fit:cover;flex:none;border:1px solid var(--line)}
  .info{min-width:0;flex:1}
  .t{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;
       -webkit-line-clamp:2;overflow:hidden;word-break:break-word;color:var(--text)}
  .sub{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bvid{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--surface-3);
       border:1px solid var(--line);padding:0 4px;border-radius:3px}
  .empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:12.5px}

  .cmt{padding:10px 14px;border-bottom:1px solid var(--line)}
  .cmt:hover{background:var(--surface-2)}
  .cmt .h{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--dim)}
  .cmt .h b{color:var(--text-2);font-weight:600;font-size:12.5px}
  .cmt .h .lk{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .cmt .m{margin-top:4px;font-size:13px;line-height:1.6;word-break:break-word;color:var(--text-2)}
  .cmtbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);
       font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
  .cmtbar button{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-md);
       color:var(--text-2);background:var(--surface)}
  .cmtbar button:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
  .cmtbar button:disabled{opacity:.45;cursor:not-allowed}
  .cmtbox{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex:none}
  .cmtbox textarea{flex:1;resize:vertical;min-height:44px;padding:7px 9px;border-radius:var(--r-md);
       border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;
       font-size:13px;outline:none}
  .cmtbox textarea::placeholder{color:var(--muted)}
  .cmtbox textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,174,236,.16)}
  .cmtbox button{padding:8px 16px;border:1px solid var(--line);border-radius:var(--r-md);
       background:var(--surface);font-size:12.5px;color:var(--text-2)}
  .cmtbox button:hover{border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}

  /* 日志 */
  .log{overflow:auto;flex:1;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.55}
  .l{display:flex;gap:8px;padding:3px 4px;border-radius:3px}
  .l:hover{background:var(--surface-3)}
  .l .lt{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .l .c{color:var(--blue-dark);flex:none}
  .l.bad .c{color:var(--err)}
  .l .s{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot{flex:none;font-size:11px;color:var(--muted);text-align:center;padding:6px;
       border-top:1px solid var(--line)}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;
       justify-content:center;z-index:50}
  .mask.cur{display:flex}
  .dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       box-shadow:0 8px 28px rgba(0,0,0,.14);padding:20px;width:336px;
       display:flex;flex-direction:column;gap:12px;align-items:center}
  .dlg h3{font-size:14px;font-weight:600;color:var(--text)}
  .dlg .qbox{width:220px;height:220px;background:#fff;border:1px solid var(--line);
       border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .dlg .qbox img{width:100%;height:100%;object-fit:contain}
  .dlg .tip{font-size:12px;color:var(--dim);text-align:center;min-height:18px}
  .dlg .tip.ok{color:var(--ok)} .dlg .tip.bad{color:var(--err)}
  .dlg .row2{display:flex;gap:8px}
  .dlg .row2 button{padding:6px 14px;border:1px solid var(--line);border-radius:var(--r-md);
       font-size:12.5px;color:var(--text-2);background:var(--surface)}
  .dlg .row2 button:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .folders{width:100%;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .folders button{text-align:left;padding:8px 12px;border:1px solid var(--line);
       border-radius:var(--r-md);font-size:13px;color:var(--text-2);background:var(--surface)}
  .folders button:hover{border-color:var(--blue);color:var(--blue-dark);background:var(--blue-soft)}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--surface);
       border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:var(--r-md);
       font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);opacity:0;pointer-events:none;
       transition:opacity .18s var(--ease);z-index:99;max-width:70vw}
  #toast.cur{opacity:1}
  #toast.bad{border-color:#f5c2c4;color:var(--err)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#bfc4cb;background-clip:content-box;border:2px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:1460px){
    main{grid-template-columns:minmax(300px,340px) minmax(0,1fr) 300px}
  }
  @media (max-width:1180px){
    body{overflow:auto}
    main{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(320px,auto);min-height:0}
    .panel{min-height:320px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">bili<b>-ai</b></div>
  <span class="badge" id="view">idle</span>
  <span class="badge" id="mode">观察模式</span>
  <div class="spacer"></div>
  <div class="meta" id="meta">—</div>
  <div id="acct"></div>
</header>

<main>
  <section class="panel">
    <h2>Now Playing</h2>
    <div class="cover">
      <div class="ph" id="coverPh">逻辑播放 · 无解码器</div>
      <img id="cover" style="display:none" alt="">
      <span class="badge" id="pstate">idle</span>
    </div>
    <div class="pbody">
      <div class="ptitle" id="ptitle">尚未打开视频</div>
      <div class="pup" id="pup">—</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="times"><span id="tcur">00:00</span><span id="tdur">00:00</span></div>
      <div class="stats" id="stats"></div>
      <div class="acts">
        <button class="act" id="btnLike" data-act="like">点赞</button>
        <button class="act" id="btnCoin" data-act="coin">投币</button>
        <button class="act" id="btnFav" data-act="fav">收藏</button>
        <button class="act" id="btnCmt" data-act="comments">评论</button>
      </div>
    </div>
    <div class="foot">进度由服务端时钟推进 · 0.35s 同步</div>
  </section>

  <section class="panel">
    <div class="tabs">
      <button class="tab cur" id="tabList">搜索结果</button>
      <button class="tab" id="tabCmt">评论</button>
      <button class="tab" id="tabSub">字幕</button>
    </div>
    <div class="pane cur" id="list"><div class="empty">等待 search 命令</div></div>
    <div class="pane" id="cmts"><div class="empty">尚未加载评论</div></div>
    <div class="pane" id="subs">
      <div class="subbar">
        <select id="subLang" title="字幕轨"></select>
        <button id="subLoad">读取</button>
        <button id="subMore" disabled>加载更多</button>
        <button id="subExport">导出 txt</button>
        <span id="subMeta">—</span>
      </div>
      <div class="subt" id="subBody"><div class="empty">点「读取」拉取当前视频字幕</div></div>
    </div>
    <div class="cmtbox" id="cmtbox" style="display:none">
      <textarea id="cmtInput" rows="2" maxlength="1000" placeholder="写下你的评论…（Ctrl+Enter 发送）"></textarea>
      <button id="cmtSend">发送</button>
    </div>
    <div class="cmtbar" id="cmtbar" style="display:none">
      <span id="cmtMeta">—</span>
      <div class="spacer"></div>
      <button id="cmtPrev">上一页</button>
      <button id="cmtNext">下一页</button>
    </div>
  </section>

  <section class="panel">
    <h2>Command Log</h2>
    <div class="log" id="log"><div class="empty">—</div></div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="dlg" id="dlgQr">
    <h3>扫码登录</h3>
    <div class="qbox"><img id="qrImg" alt="二维码"></div>
    <div class="tip" id="qrTip">正在申请二维码…</div>
    <div class="row2"><button id="qrRefresh">刷新二维码</button><button id="qrClose">关闭</button></div>
  </div>
  <div class="dlg" id="dlgFav" style="display:none">
    <h3>选择收藏夹</h3>
    <div class="folders" id="folderList"></div>
    <div class="row2"><button id="favClose">取消</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const CN = n => n >= 1e8 ? (n/1e8).toFixed(1)+'亿' : n >= 1e4 ? (n/1e4).toFixed(1)+'万' : String(n||0);
const HMS = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h? h+':' : '') + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };
const IMG = u => u ? '/api/thumb?u=' + encodeURIComponent(u.startsWith('//') ? 'https:'+u : u) : '';
function esc(s){ return String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

let snap = null, basePos = 0, baseAt = 0, playing = false, lastBvid = '';
let tab = 'list', cmtPage = 1;

function tick(){
  if (!snap) return;
  const p = snap.player || {};
  let pos = p.pos || 0;
  if (playing && p.dur) pos = Math.min(p.dur, pos + (performance.now() - baseAt)/1000);
  $('#tcur').textContent = HMS(pos);
  $('#tdur').textContent = HMS(p.dur);
  $('#bar').style.width = p.dur ? Math.min(100, pos/p.dur*100) + '%' : '0%';
}
setInterval(tick, 200);

/* ---------- 请求 ---------- */
async function api(path, body){
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}
let toastT = null;
function toast(msg, bad){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'cur' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = '', 2600);
}
async function cmd(name, args){
  const j = await api('/api/cmd', {name, args: args||{}});
  if (!j.ok) toast(j.out.split('\n')[0], true);
  else toast(j.out.split('\n')[0]);
  return j;
}

/* ---------- 账号 ---------- */
let qrTimer = null, qrKey = null;

function renderAccount(a){
  a = a || {};
  const box = $('#acct');
  if (a.login){
    box.innerHTML = `
      <div class="acct">
        ${a.avatar ? `<img src="${IMG(a.avatar)}" alt="">` : ''}
        <span class="nm">${esc(a.uname)}</span>
        <button id="btnLogout">退出</button>
      </div>`;
    $('#btnLogout').onclick = async () => {
      await api('/api/auth/logout', {});
      toast('已退出登录');
      refreshAuth();
    };
  } else {
    box.innerHTML = '<button class="btn-login" id="btnLogin">扫码登录</button>';
    $('#btnLogin').onclick = openQr;
  }
}

async function refreshAuth(){
  try {
    const info = await api('/api/auth');
    renderAccount(info.is_login ? {login:true, uname:info.uname, mid:info.mid, avatar:info.avatar} : {login:false});
  } catch (e) { /* 网络异常时保留上次渲染 */ }
}

function closeMask(){
  $('#mask').className = 'mask';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
}

async function openQr(){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'flex';
  $('#dlgFav').style.display = 'none';
  $('#qrTip').className = 'tip';
  $('#qrTip').textContent = '正在申请二维码…';
  $('#qrImg').removeAttribute('src');
  if (qrTimer) { clearInterval(qrTimer); qrTimer = null; }
  const r = await api('/api/auth/qr', {});
  if (!r.ok){ $('#qrTip').textContent = r.msg || '申请失败'; $('#qrTip').className='tip bad'; return; }
  qrKey = r.key;
  $('#qrImg').src = r.png;
  $('#qrTip').textContent = '用手机 B 站客户端扫一扫';
  qrTimer = setInterval(pollQr, 1600);
}

async function pollQr(){
  if (!qrKey) return;
  let r;
  try { r = await api('/api/auth/poll?key=' + encodeURIComponent(qrKey)); }
  catch (e) { return; }
  const tip = $('#qrTip');
  if (r.status === 'scanned'){ tip.textContent = '已扫码，请在手机上确认登录'; tip.className = 'tip'; }
  else if (r.status === 'expired'){
    tip.textContent = '二维码已失效，点「刷新二维码」重试'; tip.className = 'tip bad';
    clearInterval(qrTimer); qrTimer = null;
  } else if (r.status === 'ok'){
    tip.textContent = '登录成功：' + (r.uname || '') ; tip.className = 'tip ok';
    clearInterval(qrTimer); qrTimer = null;
    toast('登录成功：' + (r.uname || ''));
    setTimeout(() => { closeMask(); refreshAuth(); }, 700);
  } else {
    tip.textContent = '等待扫码…';
  }
}

/* ---------- 互动 ---------- */
function renderInter(s){
  const it = s.inter || {};
  const cur = s.current;
  const login = (s.account || {}).login;
  const on = v => v === true ? ' on' : '';
  const like = $('#btnLike'), coin = $('#btnCoin'), fav = $('#btnFav'), cmt = $('#btnCmt');
  like.textContent = it.liked === true ? '已赞' : (it.liked === false ? '点赞' : '点赞');
  like.className = 'act' + on(it.liked);
  coin.textContent = it.coins ? ('已投 ' + it.coins) : '投币';
  coin.className = 'act' + (it.coins ? ' on' : '');
  fav.textContent = it.favoured === true ? '已收藏' : '收藏';
  fav.className = 'act' + on(it.favoured);
  [like, coin, fav].forEach(b => b.disabled = !cur);
  cmt.disabled = !cur;
  cmt.className = 'act' + (tab === 'cmt' ? ' on' : '');
}

$('#btnLike').onclick = async () => {
  const it = (snap && snap.inter) || {};
  await cmd('like', {on: !(it.liked === true)});
};
$('#btnCoin').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.coins > 0) return toast('该视频已投过币');
  await cmd('coin', {n: 2, also_like: false});
};
$('#btnFav').onclick = async () => {
  const it = (snap && snap.inter) || {};
  if (it.favoured === true) return cmd('unfav', {});
  const r = await fetch('/api/folders').then(x => x.json());
  if (!r.ok){
    toast(r.msg || '读取收藏夹失败', true);
    if (r.need_login) openQr();
    return;
  }
  if (!r.items.length) return toast('账号下没有收藏夹', true);
  showFolders(r.items);
};
$('#btnCmt').onclick = () => { switchTab('cmt'); loadComments(1); };

function showFolders(items){
  $('#mask').className = 'mask cur';
  $('#dlgQr').style.display = 'none';
  $('#dlgFav').style.display = 'flex';
  $('#folderList').innerHTML = items.map(f =>
    `<button data-id="${f.id}">${esc(f.title)} <span style="color:var(--dim);font-size:11px">${f.count}</span></button>`
  ).join('');
  $('#folderList').querySelectorAll('button').forEach(b => {
    b.onclick = async () => {
      closeMask();
      await cmd('fav', {folder: b.dataset.id});
    };
  });
}

/* ---------- 评论 ---------- */
function switchTab(t){
  tab = t;
  [['list','#tabList','#list'],['cmt','#tabCmt','#cmts'],['sub','#tabSub','#subs']].forEach(([k,tid,pid]) => {
    const te = $(tid), pe = $(pid);
    if (te) te.className = 'tab' + (t === k ? ' cur' : '');
    if (pe) pe.className = 'pane' + (t === k ? ' cur' : '');
  });
  $('#cmtbar').style.display = t === 'cmt' ? 'flex' : 'none';
  $('#cmtbox').style.display = t === 'cmt' && !!(snap || {}).current ? 'flex' : 'none';
  renderInter(snap || {});
}
$('#tabList').onclick = () => switchTab('list');
$('#tabCmt').onclick = () => { switchTab('cmt'); if (!((snap||{}).comments||[]).length) loadComments(1); };

async function sendComment(){
  const el = $('#cmtInput');
  const msg = (el.value || '').trim();
  if (!msg) return toast('评论内容不能为空', true);
  const j = await cmd('comment', {message: msg});
  if (!j.ok) return;
  el.value = '';
  await loadComments(1);
}
$('#cmtSend').onclick = sendComment;
$('#cmtInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); sendComment(); }
});

async function loadComments(page){
  const j = await cmd('comments', {page, limit: 20});
  if (j.ok) cmtPage = page;
}

async function refreshComments(){
  const j = await cmd('comments', {page: cmtPage, limit: 20});
  return j.ok;
}

$('#cmtPrev').onclick = () => { if (cmtPage > 1) loadComments(cmtPage - 1); };
$('#cmtNext').onclick = () => loadComments(cmtPage + 1);

function renderComments(s){
  const list = s.comments || [], meta = s.comments_meta || {};
  const box = $('#cmts');
  $('#cmtbox').style.display = (tab === 'cmt' && s.current) ? 'flex' : 'none';
  if (!list.length){
    box.innerHTML = '<div class="empty">尚未加载评论</div>';
    $('#cmtMeta').textContent = '—';
    $('#cmtPrev').disabled = true; $('#cmtNext').disabled = true;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="cmt">
      <div class="h"><b>${esc(c.uname)}</b><span class="lk">赞 ${CN(c.like)}${c.sub ? ' · 回复 '+CN(c.sub) : ''}</span></div>
      <div class="m">${esc(c.msg)}</div>
    </div>`).join('');
  $('#cmtMeta').textContent = `第 ${meta.page||1} 页 · 共 ${CN(meta.total||0)} 条` + (meta.is_end ? ' · 已到末页' : '');
  $('#cmtPrev').disabled = (meta.page||1) <= 1;
  $('#cmtNext').disabled = !!meta.is_end;
}

/* ---------- 字幕 ---------- */
let subLang = '', subOffset = 0, subDone = false, subLoading = false;

function parseSubTracks(out){
  const tracks = [];
  out.split('\n').forEach(ln => {
    const m = ln.match(/lan=(\S+)\s+(.*?)\s+ai=(\d)\s+lock=(\d)/);
    if (m) tracks.push({lan:m[1], doc:m[2], ai:m[3]==='1', lock:m[4]==='1'});
  });
  return tracks;
}

async function loadSubTracks(){
  const j = await cmd('subtitles', {});
  if (!j.ok) return false;
  const tracks = parseSubTracks(j.out);
  const sel = $('#subLang');
  if (!tracks.length){
    sel.innerHTML = '<option>无字幕轨</option>';
    $('#subBody').innerHTML = '<div class="empty">该视频没有平台字幕（画面内嵌硬字幕无法获取）</div>';
    $('#subMeta').textContent = '0 轨';
    subLang = '';
    return false;
  }
  sel.innerHTML = tracks.map(t =>
    `<option value="${esc(t.lan)}">${esc(t.doc||t.lan)}${t.ai?' · AI':''}${t.lock?' · 需解锁':''}</option>`).join('');
  const usable = tracks.find(t => !t.lock && t.lan === 'ai-zh')
    || tracks.find(t => !t.lock && /^zh/i.test(t.lan))
    || tracks.find(t => !t.lock) || tracks[0];
  sel.value = usable.lan; subLang = usable.lan;
  $('#subMeta').textContent = tracks.length + ' 轨';
  return true;
}

async function loadSubs(reset){
  if (subLoading) return;
  subLoading = true;
  const body = $('#subBody');
  try {
    if (reset){ subOffset = 0; subDone = false; body.innerHTML = ''; }
    const j = await cmd('subtitle', {lang: subLang, offset: subOffset, limit: 300});
    if (!j.ok) return;
    const lines = j.out.split('\n');
    const head = lines[0] || '';
    const cues = [];
    lines.slice(1).forEach(ln => {
      const m = ln.match(/^\[(\d+:\d{2})\]\s(.*)$/);
      if (m) cues.push({ts:m[1], tx:m[2]});
    });
    body.insertAdjacentHTML('beforeend', cues.map(c =>
      `<div class="cue"><span class="ts">${c.ts}</span><span class="tx">${esc(c.tx)}</span></div>`).join(''));
    const nx = (j.out.match(/next: subtitle --offset (\d+)/) || [])[1];
    if (nx){ subOffset = parseInt(nx, 10); $('#subMore').disabled = false; }
    else { subDone = true; $('#subMore').disabled = true; }
    const cm = head.match(/cues=(\d+)\s+chars=(\d+)/);
    $('#subMeta').textContent = subLang + (cm ? ` · ${cm[1]} 句 / ${cm[2]} 字` : '')
      + (subDone ? ' · 已到末尾' : ` · 已读至 ${subOffset}`);
    if (!cues.length && reset) body.innerHTML = '<div class="empty">字幕内容为空</div>';
    body.scrollTop = body.scrollHeight;
  } finally { subLoading = false; }
}

async function exportSubs(){
  const j = await cmd('subtitle', {lang: subLang, export:'txt'});
  if (j.ok){
    const m = j.out.match(/path=(.+)/);
    toast('已导出：' + (m ? m[1].trim() : 'ok'));
  }
}

$('#tabSub').onclick = async () => {
  switchTab('sub');
  if (!(snap||{}).current) return toast('先打开一个视频', true);
  if (!subLang){
    const ok = await loadSubTracks();
    if (ok) await loadSubs(true);
  }
};
$('#subLang').onchange = () => { subLang = $('#subLang').value; loadSubs(true); };
$('#subLoad').onclick = async () => {
  if (!subLang && !await loadSubTracks()) return;
  await loadSubs(true);
};
$('#subMore').onclick = () => loadSubs(false);
$('#subExport').onclick = async () => {
  if (!subLang && !await loadSubTracks()) return;
  exportSubs();
};

/* ---------- 主渲染 ---------- */
function render(s){
  const p = s.player || {}, c = s.current;

  $('#view').textContent = 'view: ' + (s.view || 'idle');
  $('#view').className = 'badge' + (s.view === 'video' ? ' pink' : s.view === 'search' ? ' on' : '');
  $('#mode').textContent = s.readonly ? 'MCP 模式' : 'serve 模式';
  $('#meta').textContent = 'uptime ' + Math.floor(s.uptime||0) + 's · total ' + CN(s.total||0);

  if (c && c.bvid !== lastBvid){
    lastBvid = c.bvid; subLang = ''; subOffset = 0; subDone = false;
    $('#subLang').innerHTML = ''; $('#subMore').disabled = true;
    $('#subMeta').textContent = '—';
    $('#subBody').innerHTML = '<div class="empty">点「读取」拉取当前视频字幕</div>';
  }
  if (c){
    $('#ptitle').textContent = c.title || '—';
    $('#pup').textContent = (c.up||'') + (c.mid ? ' · mid '+c.mid : '') + (c.dur ? ' · '+HMS(c.dur) : '');
    if (c.pic){ $('#cover').src = IMG(c.pic); $('#cover').style.display='block'; $('#coverPh').style.display='none'; }
    $('#stats').innerHTML = [
      ['播放', CN(c.view)], ['点赞', CN(c.like)], ['投币', CN(c.coin)],
      ['收藏', CN(c.fav)], ['弹幕', CN(c.danmaku)], ['评论', CN(c.reply)]
    ].map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  } else {
    $('#ptitle').textContent = '尚未打开视频';
    $('#pup').textContent = '—'; $('#stats').innerHTML = '';
    $('#cover').style.display='none'; $('#coverPh').style.display='flex'; $('#coverPh').textContent='逻辑播放 · 无解码器';
  }
  $('#pstate').textContent = p.bvid ? (p.playing ? 'playing' : 'paused') : 'idle';
  $('#pstate').className = 'badge' + (p.playing ? ' on' : '');

  const items = s.items || [];
  $('#tabList').textContent = s.view === 'search' ? `搜索结果 (${items.length})` : s.view === 'video' ? '详情' : '搜索结果';
  if (items.length){
    $('#list').innerHTML = items.map((it,i) => `
      <div class="row ${p.bvid === it.bvid ? 'cur' : ''}">
        <div class="idx">${i+1}</div>
        ${it.pic ? `<img class="thumb" src="${IMG(it.pic)}" loading="lazy" alt="">` : '<div class="thumb"></div>'}
        <div class="info">
          <div class="t">${esc(it.title)}</div>
          <div class="sub"><span class="bvid">${it.bvid}</span><span>${it.dur}</span><span>${CN(it.play)} 播放</span><span>${esc(it.up)}</span></div>
        </div>
      </div>`).join('');
  } else if (s.view === 'idle'){
    $('#list').innerHTML = '<div class="empty">等待 search 命令</div>';
  } else {
    $('#list').innerHTML = '<div class="empty">无数据（可能命中风控）</div>';
  }

  renderComments(s);
  renderInter(s);

  const log = s.log || [];
  $('#log').innerHTML = log.length ? log.map(l =>
    `<div class="l ${l.ok?'':'bad'}" title="${esc(l.cmd)} · ${esc(l.summary)}"><span class="lt">${l.t}</span><span class="c">${esc(l.cmd)}</span><span class="s">${esc(l.summary)}</span></div>`
  ).join('') : '<div class="empty">—</div>';
}

$('#qrRefresh').onclick = openQr;
$('#qrClose').onclick = closeMask;
$('#favClose').onclick = closeMask;
$('#mask').onclick = e => { if (e.target === $('#mask')) closeMask(); };

const es = new EventSource('/api/events');
es.onmessage = e => {
  const s = JSON.parse(e.data);
  snap = s; playing = !!(s.player && s.player.playing);
  basePos = (s.player && s.player.pos) || 0; baseAt = performance.now();
  render(s); tick();
  renderAccount(s.account && s.account.login ? s.account : {login:false});
};
es.onerror = () => { $('#mode').textContent = '断线重连中…'; };

refreshAuth();
</script>
